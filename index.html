<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashen Realms Test</title>
</head>
<body style="background:#100d0b;color:white;font-family:Georgia,serif;padding:20px">
<h1>Ashen Realms</h1>
<p id="status">Waiting...</p>
<button id="testButton">TEST BUTTON</button>
<div id="game" style="margin-top:20px"></div>
<script>
document.getElementById("testButton").addEventListener("click", function() {
    document.getElementById("status").textContent = "JAVASCRIPT IS WORKING!";
    document.getElementById("game").innerHTML =
        "<h2>Ember Hollow</h2>" +
        "<p>You have entered Ember Hollow.</p>" +
        "<button id='forestButton'>Explore Forest</button>";
    document.getElementById("forestButton").addEventListener("click", function() {
        document.getElementById("game").innerHTML =
            "<h2>Whispering Forest</h2>" +
            "<p>You hear movement in the trees.</p>" +
            "<button id='investigateButton'>Investigate Movement</button>";
        document.getElementById("investigateButton").addEventListener("click", function() {
            document.getElementById("game").innerHTML =
                "<h2>⚔️ Encounter!</h2>" +
                "<p>An Ash Wolf steps from the trees!</p>" +
                "<button id='attackButton'>Attack</button>";
            document.getElementById("attackButton").addEventListener("click", function() {
                document.getElementById("game").innerHTML =
                    "<h2>Victory!</h2>" +
                    "<p>You defeated the Ash Wolf.</p>";
            });
        });
    });
});
</script>
</body>
</html>
