<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ashen Realms: Pocket Edition</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: Georgia, "Times New Roman", serif;
}
#game {
    max-width: 700px;
    margin: auto;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #30241b 0%, #17130f 45%, #0d0d0d 100%);
    padding-bottom: 30px;
}
header {
    text-align: center;
    padding: 22px 15px 12px;
    border-bottom: 1px solid #59452f;
}
h1 {
    margin: 0;
    color: #e7b85c;
    font-size: 30px;
}
.subtitle {
    color: #a99b88;
    margin-top: 5px;
    font-size: 14px;
}
#screen {
    padding: 18px;
}
.panel {
    background: rgba(27, 23, 19, .94);
    border: 1px solid #5c472e;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.35);
}
h2 {
    color: #e2ad51;
    margin-top: 0;
}
h3 {
    color: #cda25c;
}
.story {
    line-height: 1.65;
    color: #ddd;
}
button {
    width: 100%;
    border: 1px solid #765a35;
    border-radius: 9px;
    background: linear-gradient(#493820, #2d2318);
    color: #f4dfb1;
    padding: 14px 12px;
    margin: 6px 0;
    font-size: 16px;
    font-family: Georgia, "Times New Roman", serif;
    cursor: pointer;
}
button:active {
    transform: scale(.98);
    background: #5a4325;
}
button:disabled {
    opacity: .45;
}
.primary {
    background: linear-gradient(#80551f, #4d3013);
    border-color: #b57b2c;
    color: #fff0c5;
}
.danger {
    background: linear-gradient(#682a24, #381613);
}
.good {
    background: linear-gradient(#29472c, #182b1a);
}
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}
.stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}
.stat {
    background: #171411;
    border: 1px solid #3e3327;
    padding: 9px;
    border-radius: 7px;
}
.stat span {
    color: #a9977c;
    font-size: 12px;
}
.stat strong {
    display: block;
    color: #eee;
    font-size: 17px;
    margin-top: 2px;
}
.bar {
    height: 12px;
    background: #261b18;
    border-radius: 10px;
    overflow: hidden;
    margin: 5px 0 10px;
}
.bar-inner {
    height: 100%;
    background: #a94438;
    transition: width .3s;
}
.xpbar .bar-inner {
    background: #b7832f;
}
.item {
    padding: 9px 0;
    border-bottom: 1px solid #332b23;
}
.item:last-child {
    border-bottom: none;
}
.muted {
    color: #998f82;
}
.gold {
    color: #e6b54d;
}
.enemy {
    color: #d86c5f;
}
.success {
    color: #83b982;
}
.log {
    max-height: 180px;
    overflow-y: auto;
    background: #0c0c0c;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    line-height: 1.5;
}
.log div {
    padding: 3px 0;
    border-bottom: 1px solid #1d1d1d;
}
.center {
    text-align: center;
}
.small {
    font-size: 13px;
}
input, select {
    width: 100%;
    padding: 12px;
    margin: 6px 0 10px;
    border-radius: 7px;
    border: 1px solid #5c472e;
    background: #111;
    color: #eee;
    font-size: 16px;
}
#toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: #302419;
    border: 1px solid #806133;
    color: #f4ddb0;
    padding: 10px 15px;
    border-radius: 8px;
    display: none;
    z-index: 99;
    max-width: 90%;
    text-align: center;
}
</style>
</head>
<body>
<div id="game">
<header>
    <h1>Ashen Realms</h1>
    <div class="subtitle">Pocket Edition</div>
</header>
<div id="screen"></div>
</div>
<div id="toast"></div>
<script>
/* =========================================================
   ASHEN REALMS: POCKET EDITION
   SINGLE-FILE RPG BUILD
========================================================= */
const screen = document.getElementById("screen");
let hero = {
    name: "",
    race: "Human",
    class: "Warrior",
    level: 1,
    xp: 0,
    nextXp: 100,
    hp: 100,
    maxHp: 100,
    baseAttack: 10,
    baseDefense: 10,
    gold: 25,
    weapon: "Rusty Sword",
    armor: "Traveler's Clothes",
    inventory: {
        Potion: 3
    },
    companions: [],
    location: "Ember Hollow",
    quests: {
        hollowTrouble: "active",
        ruins: "locked"
    },
    storyFlags: {
        forestVisited: false,
        oldTrail: false,
        ruinsUnlocked: false,
        ruinsEntered: false,
        ruinsBossDefeated: false,
        companionQuest: false,
        guardianDefeated: false
    }
};
let enemy = null;
let combatActive = false;
let combatLocation = "";
const weapons = {
    "Rusty Sword": 0,
    "Iron Sword": 4,
    "Shadow Dagger": 7,
    "Ember Staff": 9,
    "Moonblade": 12
};
const armor = {
    "Traveler's Clothes": 0,
    "Iron Armor": 6,
    "Ranger Cloak": 3,
    "Shadow Leather": 4,
    "Holy Vestments": 7
};
const enemies = {
    "Ash Wolf": {
        hp: 35,
        atk: 8,
        def: 3,
        xp: 30,
        gold: 10
    },
    "Ruins Goblin": {
        hp: 45,
        atk: 10,
        def: 4,
        xp: 40,
        gold: 15
    },
    "Ember Wraith": {
        hp: 55,
        atk: 12,
        def: 6,
        xp: 55,
        gold: 20
    },
    "Forest Brute": {
        hp: 70,
        atk: 14,
        def: 7,
        xp: 75,
        gold: 25
    },
    "Ashen Guardian": {
        hp: 120,
        atk: 18,
        def: 10,
        xp: 150,
        gold: 100
    }
};
const companions = {
    "Lyra": {
        hp: 60,
        atk: 12,
        ability: "Quick Shot"
    },
    "Brom": {
        hp: 80,
        atk: 10,
        ability: "Shield Bash"
    },
    "Selene": {
        hp: 45,
        atk: 16,
        ability: "Arcane Burst"
    }
};
/* =========================================================
   UTILITY
========================================================= */
function toast(message) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.style.display = "block";
    setTimeout(() => {
        el.style.display = "none";
    }, 1800);
}
function saveGame() {
    localStorage.setItem("ashenRealmsSave", JSON.stringify(hero));
    toast("Game saved.");
}
function loadGame() {
    const saved = localStorage.getItem("ashenRealmsSave");
    if (!saved) {
        toast("No saved game found.");
        return;
    }
    hero = JSON.parse(saved);
    showGame();
    toast("Game loaded.");
}
function hasCompanion(name) {
    return hero.companions.includes(name);
}
function weaponPower() {
    return weapons[hero.weapon] || 0;
}
function armorPower() {
    return armor[hero.armor] || 0;
}
function attackPower() {
    return hero.baseAttack + weaponPower();
}
function defensePower() {
    return hero.baseDefense + armorPower();
}
function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}
function heal(amount) {
    hero.hp = Math.min(hero.maxHp, hero.hp + amount);
}
function addItem(item, amount = 1) {
    if (!hero.inventory[item]) {
        hero.inventory[item] = 0;
    }
    hero.inventory[item] += amount;
}
/* =========================================================
   TITLE SCREEN
========================================================= */
function titleScreen() {
    screen.innerHTML = `
        <div class="panel center">
            <h2>The Emberlands Await</h2>
            <p class="story">
                The old kingdoms have fallen.
                The Emberlands burn beneath forgotten skies.
                Your legend begins now.
            </p>
            <button class="primary" onclick="createHero()">
                Begin Adventure
            </button>
            <button onclick="createHero()">
                Create Your Hero
            </button>
            <button onclick="loadGame()">
                Continue
            </button>
        </div>
        <div class="panel small">
            <strong>Current Build</strong>
            <p class="muted">
                Ember Hollow • Whispering Forest • Ancient Ruins
                • Combat • Loot • Quests • Companions
            </p>
        </div>
    `;
}
/* =========================================================
   CHARACTER CREATION
========================================================= */
const races = [
    "Human",
    "Elf",
    "Dwarf",
    "Halfling"
];
const classes = [
    "Warrior",
    "Ranger",
    "Mage",
    "Rogue",
    "Cleric"
];
function randomName() {
    const first = [
        "Alden","Kael","Rowan","Elara","Lyra",
        "Dorian","Mira","Thorne","Elias","Seren"
    ];
    const last = [
        "Ashfall","Ravenwood","Emberborn",
        "Stone","Nightwind","Blackmere",
        "Dawnfire","Ironwood"
    ];
    return randomItem(first) + " " + randomItem(last);
}
function createHero() {
    screen.innerHTML = `
        <div class="panel">
            <h2>Create Your Hero</h2>
            <label>Name</label>
            <input id="heroName" placeholder="Enter your name">
            <button onclick="document.getElementById('heroName').value=randomName()">
                Random Name
            </button>
            <label>Race</label>
            <select id="heroRace">
                ${races.map(r => `<option>${r}</option>`).join("")}
            </select>
            <label>Class</label>
            <select id="heroClass">
                ${classes.map(c => `<option>${c}</option>`).join("")}
            </select>
            <button onclick="randomHero()">
                Random Hero
            </button>
            <button class="primary" onclick="startAdventure()">
                Enter the Emberlands
            </button>
        </div>
    `;
}
function randomHero() {
    document.getElementById("heroName").value = randomName();
    document.getElementById("heroRace").value = randomItem(races);
    document.getElementById("heroClass").value = randomItem(classes);
}
function startAdventure() {
    const name =
        document.getElementById("heroName").value.trim() ||
        randomName();
    const race =
        document.getElementById("heroRace").value;
    const cls =
        document.getElementById("heroClass").value;
    hero = {
        name,
        race,
        class: cls,
        level: 1,
        xp: 0,
        nextXp: 100,
        hp: 100,
        maxHp: 100,
        baseAttack: 10,
        baseDefense: 10,
        gold: 25,
        weapon: "Rusty Sword",
        armor: "Traveler's Clothes",
        inventory: {
            Potion: 3
        },
        companions: [],
        location: "Ember Hollow",
        quests: {
            hollowTrouble: "active",
            ruins: "locked"
        },
        storyFlags: {
            forestVisited: false,
            oldTrail: false,
            ruinsUnlocked: false,
            ruinsEntered: false,
            ruinsBossDefeated: false,
            companionQuest: false,
            guardianDefeated: false
        }
    };
    applyClass();
    showGame();
}
function applyClass() {
    switch(hero.class) {
        case "Warrior":
            hero.maxHp = 125;
            hero.hp = 125;
            hero.baseAttack = 14;
            hero.baseDefense = 13;
            break;
        case "Ranger":
            hero.baseAttack = 15;
            hero.baseDefense = 12;
            break;
        case "Mage":
            hero.maxHp = 90;
            hero.hp = 90;
            hero.baseAttack = 18;
            hero.baseDefense = 10;
            break;
        case "Rogue":
            hero.baseAttack = 16;
            hero.baseDefense = 14;
            break;
        case "Cleric":
            hero.maxHp = 110;
            hero.hp = 110;
            hero.baseAttack = 12;
            hero.baseDefense = 15;
            break;
    }
}
/* =========================================================
   MAIN GAME SCREEN
========================================================= */
function showGame() {
    if (combatActive) {
        combatScreen();
        return;
    }
    screen.innerHTML = `
        <div class="panel">
            <h2>${hero.name}</h2>
            <div class="small muted">
                ${hero.race} ${hero.class} • Level ${hero.level}
            </div>
            <br>
            <strong>HP ${hero.hp} / ${hero.maxHp}</strong>
            <div class="bar">
                <div class="bar-inner"
                     style="width:${(hero.hp / hero.maxHp) * 100}%">
                </div>
            </div>
            <strong>XP ${hero.xp} / ${hero.nextXp}</strong>
            <div class="bar xpbar">
                <div class="bar-inner"
                     style="width:${(hero.xp / hero.nextXp) * 100}%">
                </div>
            </div>
            <div class="stat-grid">
                <div class="stat">
                    <span>Attack</span>
                    <strong>${attackPower()}</strong>
                </div>
                <div class="stat">
                    <span>Defense</span>
                    <strong>${defensePower()}</strong>
                </div>
                <div class="stat">
                    <span>Gold</span>
                    <strong class="gold">${hero.gold}</strong>
                </div>
                <div class="stat">
                    <span>Location</span>
                    <strong>${hero.location}</strong>
                </div>
            </div>
        </div>
        <div class="panel">
            ${locationStory()}
        </div>
        <div class="panel">
            <h3>Actions</h3>
            ${locationButtons()}
        </div>
        <div class="panel">
            <h3>Hero</h3>
            <button onclick="heroSheet()">Hero Sheet</button>
            <button onclick="inventory()">Inventory</button>
            <button onclick="questLog()">Quests</button>
            <button onclick="companionsScreen()">Companions</button>
        </div>
        <div class="panel">
            <button class="good" onclick="saveGame()">Save Game</button>
            <button onclick="titleScreen()">Title Screen</button>
        </div>
    `;
}
/* =========================================================
   LOCATION STORIES
========================================================= */
function locationStory() {
    if (hero.location === "Ember Hollow") {
        return `
            <h2>Ember Hollow</h2>
            <p class="story">
                Smoke drifts over the village as the people of
                Ember Hollow prepare for another uneasy night.
                Beyond the eastern gate lies the Whispering Forest.
            </p>
            <p class="story">
                The villagers speak quietly about creatures moving
                between the trees. Somewhere beyond the forest,
                ancient ruins have begun to stir.
            </p>
        `;
    }
    if (hero.location === "Whispering Forest") {
        return `
            <h2>Whispering Forest</h2>
            <p class="story">
                The trees grow impossibly tall here.
                Their branches twist together overhead,
                blocking most of the gray sky.
            </p>
            <p class="story">
                Every few moments you hear something moving
                beyond the trees.
            </p>
        `;
    }
    if (hero.location === "Ancient Ruins") {
        return `
            <h2>Ancient Ruins</h2>
            <p class="story">
                Broken towers rise from the earth like the bones
                of a forgotten kingdom.
            </p>
            <p class="story">
                The stone beneath your feet is warm.
                Something beneath the ruins is still alive.
            </p>
        `;
    }
    return `
        <h2>${hero.location}</h2>
        <p class="story">
            The road ahead disappears beneath the ash.
        </p>
    `;
}
/* =========================================================
   LOCATION BUTTONS
========================================================= */
function locationButtons() {
    if (hero.location === "Ember Hollow") {
        return `
            <button class="primary" onclick="forestIntro()">
                Explore Forest
            </button>
            ${
                hero.storyFlags.ruinsUnlocked
                ?
                `<button onclick="enterRuins()">
                    Travel to Ancient Ruins
                </button>`
                :
                ""
            }
            <button onclick="restAtHollow()">
                Rest at Ember Hollow
            </button>
            <button onclick="villageShop()">
                Visit Blacksmith
            </button>
        `;
    }
    if (hero.location === "Whispering Forest") {
        return `
            <button class="primary" onclick="forestExplore()">
                Explore Deeper
            </button>
            <button onclick="followTrail()">
                Follow the Old Trail
            </button>
            <button onclick="returnToHollow()">
                Return to Ember Hollow
            </button>
        `;
    }
    if (hero.location === "Ancient Ruins") {
        return `
            <button class="primary" onclick="ruinsExplore()">
                Explore the Ruins
            </button>
            ${
                hero.storyFlags.ruinsBossDefeated
                ?
                `<button onclick="descendAshenDepths()">
                    Descend into the Ashen Depths
                </button>`
                :
                ""
            }
            <button onclick="returnToHollow()">
                Return to Ember Hollow
            </button>
        `;
    }
    return `<button onclick="showGame()">Continue</button>`;
}
/* =========================================================
   EMBER HOLLOW
========================================================= */
function restAtHollow() {
    hero.location = "Ember Hollow";
    hero.hp = hero.maxHp;
    showGame();
    toast("You rest beside the village fire.");
}
function villageShop() {
    screen.innerHTML = `
        <div class="panel">
            <h2>The Ember Hollow Blacksmith</h2>
            <p class="story">
                The old smith looks you over.
                "If you're heading into those woods,
                you'll need better steel."
            </p>
            <p class="gold">Gold: ${hero.gold}</p>
            <button onclick="buyWeapon('Iron Sword',50)">
                Iron Sword — 50 gold
            </button>
            <button onclick="buyArmor('Iron Armor',70)">
                Iron Armor — 70 gold
            </button>
            <button onclick="buyPotion()">
                Potion — 15 gold
            </button>
            <button onclick="showGame()">
                Leave
            </button>
        </div>
    `;
}
function buyWeapon(name, cost) {
    if (hero.gold < cost) {
        toast("Not enough gold.");
        return;
    }
    hero.gold -= cost;
    hero.weapon = name;
    toast(name + " equipped.");
    villageShop();
}
function buyArmor(name, cost) {
    if (hero.gold < cost) {
        toast("Not enough gold.");
        return;
    }
    hero.gold -= cost;
    hero.armor = name;
    toast(name + " equipped.");
    villageShop();
}
function buyPotion() {
    if (hero.gold < 15) {
        toast("Not enough gold.");
        return;
    }
    hero.gold -= 15;
    addItem("Potion");
    toast("Potion purchased.");
    villageShop();
}
/* =========================================================
   FOREST
========================================================= */
function forestIntro() {
    hero.location = "Whispering Forest";
    hero.storyFlags.forestVisited = true;
    screen.innerHTML = `
        <div class="panel">
            <h2>The Whispering Forest</h2>
            <p class="story">
                You pass beneath the ancient trees.
                The sounds of Ember Hollow fade behind you.
            </p>
            <p class="story">
                Then you hear it.
                Something moves in the undergrowth.
            </p>
            <button class="primary" onclick="forestExplore()">
                Investigate the Movement
            </button>
            <button onclick="followTrail()">
                Follow the Old Trail
            </button>
            <button onclick="returnToHollow()">
                Return to Ember Hollow
            </button>
        </div>
    `;
}
function forestExplore() {
    hero.location = "Whispering Forest";
    const roll = Math.random();
    if (roll < .45) {
        startCombat("Ash Wolf", "Whispering Forest");
        return;
    }
    if (roll < .70) {
        startCombat("Forest Brute", "Whispering Forest");
        return;
    }
    if (roll < .85) {
        forestTreasure();
        return;
    }
    forestDiscovery();
}
function forestTreasure() {
    const gold = 10 + Math.floor(Math.random() * 20);
    hero.gold += gold;
    addItem("Potion");
    screen.innerHTML = `
        <div class="panel">
            <h2>Hidden Cache</h2>
            <p class="story">
                Beneath a fallen tree you discover an old
                traveler's satchel.
            </p>
            <p class="success">
                You found ${gold} gold and a Potion.
            </p>
            <button class="primary" onclick="showGame()">
                Continue
            </button>
        </div>
    `;
}
function forestDiscovery() {
    screen.innerHTML = `
        <div class="panel">
            <h2>The Stone Marker</h2>
            <p class="story">
                You discover a weathered stone marker buried
                beneath the roots.
            </p>
            <p class="story">
                A symbol has been carved into it:
                a crown surrounded by flames.
            </p>
            <p class="story">
                Beneath the symbol are three words:
                <strong>THE KING STILL DREAMS.</strong>
            </p>
            <button class="primary" onclick="unlockRuins()">
                Examine the Marker
            </button>
        </div>
    `;
}
function unlockRuins() {
    hero.storyFlags.ruinsUnlocked = true;
    hero.quests.ruins = "active";
    screen.innerHTML = `
        <div class="panel">
            <h2>A Forgotten Path</h2>
            <p class="story">
                Behind the marker you find a narrow trail.
                It leads toward broken towers in the distance.
            </p>
            <p class="success">
                Ancient Ruins unlocked.
            </p>
            <button class="primary" onclick="showGame()">
                Continue
            </button>
        </div>
    `;
}
function followTrail() {
    hero.storyFlags.oldTrail = true;
    screen.innerHTML = `
        <div class="panel">
            <h2>The Old Trail</h2>
            <p class="story">
                The trail is almost completely swallowed by
                roots and moss.
            </p>
            <p class="story">
                You follow it until you find a ruined stone arch.
                Beyond it lies a road leading deeper into the
                Emberlands.
            </p>
            ${
                hero.storyFlags.ruinsUnlocked
                ?
                `<button class="primary" onclick="enterRuins()">
                    Enter the Ancient Ruins
                </button>`
                :
                `<button onclick="forestExplore()">
                    Search the Forest
                </button>`
            }
            <button onclick="returnToHollow()">
                Return to Ember Hollow
            </button>
        </div>
    `;
}
/* =========================================================
   RUINS
========================================================= */
function enterRuins() {
    hero.location = "Ancient Ruins";
    hero.storyFlags.ruinsEntered = true;
    screen.innerHTML = `
        <div class="panel">
            <h2>Ancient Ruins</h2>
            <p class="story">
                You step beneath the broken arch.
                The temperature drops immediately.
            </p>
            <p class="story">
                Somewhere below the ruins,
                chains scrape against stone.
            </p>
            <button class="primary" onclick="ruinsExplore()">
                Enter the Ruins
            </button>
            <button onclick="returnToHollow()">
                Retreat to Ember Hollow
            </button>
        </div>
    `;
}
function ruinsExplore() {
    const roll = Math.random();
    if (roll < .40) {
        startCombat("Ruins Goblin", "Ancient Ruins");
        return;
    }
    if (roll < .65) {
        startCombat("Ember Wraith", "Ancient Ruins");
        return;
    }
    if (roll < .80) {
        ruinsTreasure();
        return;
    }
    if (roll < .92) {
        companionEncounter();
        return;
    }
    guardianEncounter();
}
function ruinsTreasure() {
    const gold = 20 + Math.floor(Math.random() * 40);
    hero.gold += gold;
    const loot = randomItem([
        "Iron Sword",
        "Ranger Cloak",
        "Shadow Leather",
        "Potion"
    ]);
    if (loot === "Potion") {
        addItem("Potion");
    } else if (weapons[loot] !== undefined) {
        hero.weapon = loot;
    } else {
        hero.armor = loot;
    }
    screen.innerHTML = `
        <div class="panel">
            <h2>Forgotten Treasure</h2>
            <p class="story">
                Behind a collapsed wall you discover a hidden chamber.
            </p>
            <p class="success">
                You found ${gold} gold.
            </p>
            <p class="success">
                You discovered: ${loot}
            </p>
            <button class="primary" onclick="showGame()">
                Continue
            </button>
        </div>
    `;
}
/* =========================================================
   COMPANION ENCOUNTER
========================================================= */
function companionEncounter() {
    const available = Object.keys(companions)
        .filter(name => !hasCompanion(name));
    if (available.length === 0) {
        startCombat("Ember Wraith", "Ancient Ruins");
        return;
    }
    const name = randomItem(available);
    hero.storyFlags.companionQuest = true;
    screen.innerHTML = `
        <div class="panel">
            <h2>A Stranger in the Ruins</h2>
            <p class="story">
                You find ${name} surrounded by enemies.
                They lower their weapon when they realize
                you are not one of the creatures hunting them.
            </p>
            <p class="story">
                "Help me get out of here," they say.
            </p>
            <button class="primary" onclick="recruitCompanion('${name}')">
                Help ${name}
            </button>
            <button onclick="startCombat('Ruins Goblin','Ancient Ruins')">
                Fight Your Way Through
            </button>
        </div>
    `;
}
function recruitCompanion(name) {
    if (!hasCompanion(name)) {
        hero.companions.push(name);
    }
    screen.innerHTML = `
        <div class="panel">
            <h2>${name} Joins You</h2>
            <p class="story">
                ${name} agrees to travel with you.
                The road ahead suddenly seems less lonely.
            </p>
            <p class="success">
                Companion recruited: ${name}
            </p>
            <button class="primary" onclick="showGame()">
                Continue
            </button>
        </div>
    `;
}
/* =========================================================
   GUARDIAN
========================================================= */
function guardianEncounter() {
    if (hero.storyFlags.guardianDefeated) {
        descendAshenDepths();
        return;
    }
    screen.innerHTML = `
        <div class="panel">
            <h2>The Ashen Guardian</h2>
            <p class="story">
                The chamber opens into a vast underground hall.
                At its center stands a warrior covered in blackened
                armor.
            </p>
            <p class="story">
                Its eyes ignite.
            </p>
            <p class="enemy">
                ASHEN GUARDIAN
            </p>
            <button class="danger" onclick="startCombat('Ashen Guardian','Ancient Ruins')">
                Face the Guardian
            </button>
            <button onclick="showGame()">
                Retreat
            </button>
        </div>
    `;
}
/* =========================================================
   COMBAT
========================================================= */
function startCombat(enemyName, location) {
    const data = enemies[enemyName];
    enemy = {
        name: enemyName,
        hp: data.hp,
        maxHp: data.hp,
        atk: data.atk,
        def: data.def,
        xp: data.xp,
        gold: data.gold
    };
    combatActive = true;
    combatLocation = location;
    combatScreen();
}
function combatScreen() {
    if (!enemy) {
        combatActive = false;
        showGame();
        return;
    }
    screen.innerHTML = `
        <div class="panel">
            <h2>Combat</h2>
            <h3 class="enemy">${enemy.name}</h3>
            <strong>
                Enemy HP: ${enemy.hp} / ${enemy.maxHp}
            </strong>
            <div class="bar">
                <div class="bar-inner"
                     style="width:${(enemy.hp / enemy.maxHp) * 100}%">
                </div>
            </div>
            <h3>${hero.name}</h3>
            <strong>
                HP: ${hero.hp} / ${hero.maxHp}
            </strong>
            <div class="bar">
                <div class="bar-inner"
                     style="width:${(hero.hp / hero.maxHp) * 100}%">
                </div>
            </div>
        </div>
        <div class="panel">
            <button class="primary" onclick="playerAttack()">
                Attack
            </button>
            <button onclick="usePotionCombat()">
                Use Potion (${hero.inventory.Potion || 0})
            </button>
            ${
                hero.companions.length
                ?
                `<button onclick="companionAttack()">
                    Companion Attack
                </button>`
                :
                ""
            }
            <button onclick="attemptFlee()">
                Flee
            </button>
        </div>
        <div class="panel">
            <h3>Battle Log</h3>
            <div id="battleLog" class="log">
                <div>You face the ${enemy.name}.</div>
            </div>
        </div>
    `;
}
function battleMessage(message) {
    const log = document.getElementById("battleLog");
    if (!log) return;
    const div = document.createElement("div");
    div.textContent = message;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}
function playerAttack() {
    if (!combatActive) return;
    const damage = Math.max(
        1,
        attackPower() - enemy.def + Math.floor(Math.random() * 6)
    );
    enemy.hp -= damage;
    if (enemy.hp <= 0) {
        enemy.hp = 0;
        victory();
        return;
    }
    enemyTurn(damage);
}
function companionAttack() {
    if (!combatActive || hero.companions.length === 0) {
        return;
    }
    const companionName = randomItem(hero.companions);
    const companion = companions[companionName];
    const damage =
        Math.max(
            1,
            companion.atk - enemy.def +
            Math.floor(Math.random() * 5)
        );
    enemy.hp -= damage;
    if (enemy.hp <= 0) {
        enemy.hp = 0;
        victory();
        return;
    }
    enemyTurn(damage);
}
function enemyTurn(playerDamage) {
    const damage = Math.max(
        1,
        enemy.atk - defensePower() +
        Math.floor(Math.random() * 5)
    );
    hero.hp -= damage;
    if (hero.hp <= 0) {
        hero.hp = 0;
        defeat();
        return;
    }
    combatScreen();
    setTimeout(() => {
        toast(`You dealt ${playerDamage}. Enemy dealt ${damage}.`);
    }, 50);
}
function usePotionCombat() {
    if (!hero.inventory.Potion || hero.inventory.Potion <= 0) {
        toast("You have no potions.");
        return;
    }
    hero.inventory.Potion--;
    const before = hero.hp;
    heal(30);
    const restored = hero.hp - before;
    enemyTurn(0);
    toast(`Potion restored ${restored} HP.`);
}
function attemptFlee() {
    if (Math.random() < .65) {
        combatActive = false;
        enemy = null;
        hero.location = combatLocation;
        screen.innerHTML = `
            <div class="panel">
                <h2>You Escape</h2>
                <p class="story">
                    You break away from the fight and disappear
                    into the darkness.
                </p>
                <button class="primary" onclick="showGame()">
                    Continue
                </button>
            </div>
        `;
    } else {
        enemyTurn(0);
        toast("You couldn't escape!");
    }
}
function victory() {
    const defeatedName = enemy.name;
    const xp = enemy.xp;
    const gold = enemy.gold;
    hero.xp += xp;
    hero.gold += gold;
    if (defeatedName === "Ashen Guardian") {
        hero.storyFlags.guardianDefeated = true;
        hero.storyFlags.ruinsBossDefeated = true;
        hero.quests.ruins = "complete";
        hero.weapon = "Moonblade";
    }
    combatActive = false;
    const oldLevel = hero.level;
    checkLevelUp();
    screen.innerHTML = `
        <div class="panel">
            <h2>Victory</h2>
            <p class="success">
                You defeated the ${defeatedName}.
            </p>
            <p>
                XP gained: <strong>${xp}</strong>
            </p>
            <p class="gold">
                Gold gained: ${gold}
            </p>
            ${
                defeatedName === "Ashen Guardian"
                ?
                `
                <p class="success">
                    You obtained the legendary Moonblade.
                </p>
                <p class="story">
                    As the Guardian falls, a staircase opens
                    beneath the chamber.
                </p>
                `
                :
                ""
            }
            ${
                hero.level > oldLevel
                ?
                `<p class="success">
                    LEVEL UP! You are now level ${hero.level}.
                </p>`
                :
                ""
            }
            <button class="primary" onclick="showGame()">
                Continue
            </button>
        </div>
    `;
    enemy = null;
}
function checkLevelUp() {
    while (hero.xp >= hero.nextXp) {
        hero.xp -= hero.nextXp;
        hero.level++;
        hero.nextXp =
            Math.floor(hero.nextXp * 1.35);
        hero.maxHp += 10;
        hero.hp = hero.maxHp;
        hero.baseAttack += 2;
        hero.baseDefense += 2;
    }
}
function defeat() {
    combatActive = false;
    enemy = null;
    hero.hp = Math.max(1, Math.floor(hero.maxHp * .25));
    hero.gold = Math.max(0, hero.gold - 10);
    hero.location = "Ember Hollow";
    screen.innerHTML = `
        <div class="panel">
            <h2>Defeated</h2>
            <p class="story">
                The darkness overtakes you.
                You awaken later beside the fire in Ember Hollow.
            </p>
            <p class="muted">
                Some gold was lost while you were rescued.
            </p>
            <button class="primary" onclick="showGame()">
                Rise Again
            </button>
        </div>
    `;
}
/* =========================================================
   ASHEN DEPTHS
========================================================= */
function descendAshenDepths() {
    hero.location = "Ashen Depths";
    screen.innerHTML = `
        <div class="panel">
            <h2>The Ashen Depths</h2>
            <p class="story">
                The staircase descends farther than any sane
                person would dare to travel.
            </p>
            <p class="story">
                At the bottom waits a darkness older than
                Ember Hollow itself.
            </p>
            <p class="success">
                The Ashen Depths are now unlocked.
            </p>
            <button class="primary" onclick="depthsEncounter()">
                Descend
            </button>
            <button onclick="returnToHollow()">
                Return to Ember Hollow
            </button>
        </div>
    `;
}
function depthsEncounter() {
    const roll = Math.random();
    if (roll < .5) {
        startCombat("Ember Wraith", "Ashen Depths");
    } else if (roll < .8) {
        startCombat("Forest Brute", "Ashen Depths");
    } else {
        startCombat("Ashen Guardian", "Ashen Depths");
    }
}
/* =========================================================
   RETURN
========================================================= */
function returnToHollow() {
    hero.location = "Ember Hollow";
    showGame();
}
/* =========================================================
   HERO SHEET
========================================================= */
function heroSheet() {
    screen.innerHTML = `
        <div class="panel">
            <h2>Hero Sheet</h2>
            <div class="stat-grid">
                <div class="stat">
                    <span>Name</span>
                    <strong>${hero.name}</strong>
                </div>
                <div class="stat">
                    <span>Race</span>
                    <strong>${hero.race}</strong>
                </div>
                <div class="stat">
                    <span>Class</span>
                    <strong>${hero.class}</strong>
                </div>
                <div class="stat">
                    <span>Level</span>
                    <strong>${hero.level}</strong>
                </div>
                <div class="stat">
                    <span>Attack</span>
                    <strong>${attackPower()}</strong>
                </div>
                <div class="stat">
                    <span>Defense</span>
                    <strong>${defensePower()}</strong>
                </div>
                <div class="stat">
                    <span>Weapon</span>
                    <strong>${hero.weapon}</strong>
                </div>
                <div class="stat">
                    <span>Armor</span>
                    <strong>${hero.armor}</strong>
                </div>
            </div>
            <br>
            <button onclick="showGame()">
                Back
            </button>
        </div>
    `;
}
/* =========================================================
   INVENTORY
========================================================= */
function inventory() {
    const items = Object.entries(hero.inventory);
    screen.innerHTML = `
        <div class="panel">
            <h2>Inventory</h2>
            ${
                items.length
                ?
                items.map(([item, amount]) => `
                    <div class="item">
                        <strong>${item}</strong>
                        <span class="muted"> × ${amount}</span>
                    </div>
                `).join("")
                :
                `<p class="muted">Your inventory is empty.</p>`
            }
            <br>
            <p>
                Weapon:
                <strong>${hero.weapon}</strong>
            </p>
            <p>
                Armor:
                <strong>${hero.armor}</strong>
            </p>
            <button onclick="showGame()">
                Back
            </button>
        </div>
    `;
}
/* =========================================================
   QUEST LOG
========================================================= */
function questLog() {
    let ruinsText =
        hero.quests.ruins === "active"
        ? "Investigate the Ancient Ruins."
        : hero.quests.ruins === "complete"
        ? "Defeat the Ashen Guardian — COMPLETE"
        : "Discover the path to the Ancient Ruins.";
    screen.innerHTML = `
        <div class="panel">
            <h2>Quest Log</h2>
            <div class="item">
                <strong>The Trouble in Ember Hollow</strong>
                <p class="muted">
                    Explore the Whispering Forest and discover
                    what is disturbing the village.
                </p>
                <span class="${
                    hero.storyFlags.forestVisited
                    ? "success"
                    : "muted"
                }">
                    ${
                        hero.storyFlags.forestVisited
                        ? "Progress made"
                        : "Active"
                    }
                </span>
            </div>
            <div class="item">
                <strong>The Forgotten Kingdom</strong>
                <p class="muted">
                    ${ruinsText}
                </p>
            </div>
            <button onclick="showGame()">
                Back
            </button>
        </div>
    `;
}
/* =========================================================
   COMPANIONS
========================================================= */
function companionsScreen() {
    screen.innerHTML = `
        <div class="panel">
            <h2>Companions</h2>
            ${
                hero.companions.length === 0
                ?
                `<p class="muted">
                    You travel alone.
                </p>`
                :
                hero.companions.map(name => {
                    const c = companions[name];
                    return `
                        <div class="item">
                            <strong>${name}</strong>
                            <p class="muted">
                                HP: ${c.hp}<br>
                                Attack: ${c.atk}<br>
                                Ability: ${c.ability}
                            </p>
                        </div>
                    `;
                }).join("")
            }
            <button onclick="showGame()">
                Back
            </button>
        </div>
    `;
}
/* =========================================================
   START
========================================================= */
titleScreen();
</script>
</body>
</html>
