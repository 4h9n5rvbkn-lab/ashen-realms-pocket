<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ashen Realms: Pocket Edition</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #0d0d12;
    color: #eee;
    font-family: Georgia, serif;
}

#game {
    max-width: 700px;
    margin: auto;
    min-height: 100vh;
    padding: 18px;
}

h1, h2, h3 {
    text-align: center;
    color: #d9a441;
}

h1 {
    font-size: 32px;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    font-style: italic;
    margin-bottom: 25px;
}

.panel {
    background: #181820;
    border: 1px solid #393945;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
}

.story {
    line-height: 1.65;
    font-size: 17px;
    white-space: pre-line;
}

.center {
    text-align: center;
}

button {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    border: 1px solid #765b28;
    border-radius: 9px;
    background: #29231a;
    color: #f1d18a;
    font-size: 16px;
    font-family: Georgia, serif;
}

button:active {
    transform: scale(.98);
}

.primary {
    background: #60481d;
    color: white;
}

.danger {
    background: #421f1f;
    border-color: #7c3838;
}

.good {
    background: #203d2b;
    border-color: #417553;
}

.hidden {
    display: none !important;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 6px 0 12px;
    background: #0f0f14;
    color: white;
    border: 1px solid #444;
    border-radius: 7px;
    font-size: 16px;
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.stat {
    background: #101016;
    padding: 10px;
    border-radius: 7px;
    border: 1px solid #30303a;
}

.stat strong {
    color: #d9a441;
}

.location {
    text-align: center;
    color: #c79b4a;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 15px;
}

.item {
    padding: 8px;
    border-bottom: 1px solid #292932;
}

.hpbar {
    height: 14px;
    background: #351818;
    border-radius: 10px;
    overflow: hidden;
    margin: 7px 0 12px;
}

.hpfill {
    height: 100%;
    background: #7c3030;
    width: 100%;
}

.log {
    max-height: 180px;
    overflow-y: auto;
    background: #0a0a0e;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    color: #bbb;
}

.log div {
    margin-bottom: 7px;
}
</style>
</head>

<body>

<div id="game">

<!-- TITLE -->

<section id="titleScreen">

<div class="panel">

<h1>Ashen Realms</h1>

<div class="subtitle">Pocket Edition</div>

<p class="story center">
The old kingdoms have fallen.
The Emberlands burn beneath forgotten skies.
Your legend begins now.
</p>

<button class="primary" onclick="showCharacterCreation()">
Begin Adventure
</button>

<button onclick="showCharacterCreation()">
Create Your Hero
</button>

</div>

</section>


<!-- CHARACTER CREATION -->

<section id="characterScreen" class="hidden">

<div class="panel">

<h2>Create Your Hero</h2>

<label>Name</label>

<input id="heroName" type="text" placeholder="Enter your name">

<button onclick="randomName()">Random Name</button>

<label>Race</label>

<select id="heroRace">
<option>Human</option>
<option>Elf</option>
<option>Dwarf</option>
<option>Half-Elf</option>
<option>Halfling</option>
</select>

<label>Class</label>

<select id="heroClass">
<option>Warrior</option>
<option>Ranger</option>
<option>Mage</option>
<option>Rogue</option>
<option>Cleric</option>
</select>

<button onclick="randomHero()">Random Hero</button>

<button class="primary" onclick="startAdventure()">
Continue
</button>

</div>

</section>


<!-- GAME SCREEN -->

<section id="gameScreen" class="hidden">

<div class="panel">

<h2 id="locationTitle"></h2>

<div id="locationType" class="location"></div>

<div id="storyText" class="story"></div>

<div id="choices"></div>

</div>


<div class="panel">

<h3>Hero</h3>

<div class="stat-grid">

<div class="stat">
<strong>Name</strong><br>
<span id="statName"></span>
</div>

<div class="stat">
<strong>Level</strong><br>
<span id="statLevel"></span>
</div>

<div class="stat">
<strong>HP</strong><br>
<span id="statHP"></span>
</div>

<div class="stat">
<strong>Attack</strong><br>
<span id="statAttack"></span>
</div>

<div class="stat">
<strong>Defense</strong><br>
<span id="statDefense"></span>
</div>

<div class="stat">
<strong>Gold</strong><br>
<span id="statGold"></span>
</div>

<div class="stat">
<strong>XP</strong><br>
<span id="statXP"></span>
</div>

<div class="stat">
<strong>Weapon</strong><br>
<span id="statWeapon"></span>
</div>

<div class="stat">
<strong>Armor</strong><br>
<span id="statArmor"></span>
</div>

<div class="stat">
<strong>Location</strong><br>
<span id="statLocation"></span>
</div>

</div>

</div>


<div class="panel">

<h3>Inventory</h3>

<div id="inventory"></div>

</div>


<div class="panel">

<h3>Adventure Log</h3>

<div id="log" class="log"></div>

</div>

</section>


<!-- COMBAT -->

<section id="combatScreen" class="hidden">

<div class="panel">

<h2 id="enemyName"></h2>

<p id="enemyDescription" class="story"></p>

<div>
HP:
<span id="enemyHP"></span> /
<span id="enemyMaxHP"></span>
</div>

<div class="hpbar">
<div id="enemyHPBar" class="hpfill"></div>
</div>

</div>


<div class="panel">

<h3>Your HP</h3>

<div>
<span id="combatHeroHP"></span> /
<span id="combatHeroMaxHP"></span>
</div>

<div class="hpbar">
<div id="heroHPBar" class="hpfill"></div>
</div>

<button class="danger" onclick="attackEnemy()">
Attack
</button>

<button onclick="usePotion()">
Use Potion
</button>

<button onclick="defendTurn()">
Defend
</button>

<p id="combatMessage" class="story"></p>

</div>

</section>

</div>


<script>

/* =========================
   HERO
========================= */

let hero = {
    name: "",
    race: "Human",
    class: "Warrior",

    hp: 100,
    maxHp: 100,

    baseAttack: 10,
    baseDefense: 10,

    level: 1,
    xp: 0,
    nextXp: 100,

    gold: 25,

    weapon: "Rusty Sword",
    armor: "Traveler's Clothes",

    inventory: {
        Potion: 3,
        "Old Coin": 0
    },

    location: "Ember Hollow"
};


let currentEnemy = null;
let returnScene = "";


/* =========================
   DATA
========================= */

const names = [
    "Alden",
    "Rowan",
    "Kael",
    "Elara",
    "Mira",
    "Thorne",
    "Lyra",
    "Bren",
    "Aric",
    "Selene",
    "Dorian",
    "Rhea"
];


const classBonuses = {

    Warrior: {
        hp: 25,
        attack: 4,
        defense: 3
    },

    Ranger: {
        hp: 0,
        attack: 5,
        defense: 2
    },

    Mage: {
        hp: -10,
        attack: 8,
        defense: 0
    },

    Rogue: {
        hp: 0,
        attack: 6,
        defense: 4
    },

    Cleric: {
        hp: 10,
        attack: 2,
        defense: 5
    }

};


/* =========================
   BASIC FUNCTIONS
========================= */

function $(id) {
    return document.getElementById(id);
}


function showCharacterCreation() {

    $("titleScreen").classList.add("hidden");
    $("characterScreen").classList.remove("hidden");

}


function randomName() {

    $("heroName").value =
        names[Math.floor(Math.random() * names.length)];

}


function randomHero() {

    randomName();

    const races = [
        "Human",
        "Elf",
        "Dwarf",
        "Half-Elf",
        "Halfling"
    ];

    const classes = [
        "Warrior",
        "Ranger",
        "Mage",
        "Rogue",
        "Cleric"
    ];

    $("heroRace").value =
        races[Math.floor(Math.random() * races.length)];

    $("heroClass").value =
        classes[Math.floor(Math.random() * classes.length)];

}


/* =========================
   START GAME
========================= */

function startAdventure() {

    hero.name =
        $("heroName").value.trim() ||
        names[Math.floor(Math.random() * names.length)];

    hero.race = $("heroRace").value;
    hero.class = $("heroClass").value;

    hero.hp = 100;
    hero.maxHp = 100;

    hero.baseAttack = 10;
    hero.baseDefense = 10;

    hero.level = 1;
    hero.xp = 0;
    hero.nextXp = 100;

    hero.gold = 25;

    hero.weapon = "Rusty Sword";
    hero.armor = "Traveler's Clothes";

    hero.inventory = {
        Potion: 3,
        "Old Coin": 0
    };

    const bonus = classBonuses[hero.class];

    hero.maxHp += bonus.hp;
    hero.hp = hero.maxHp;

    hero.baseAttack += bonus.attack;
    hero.baseDefense += bonus.defense;

    hero.location = "Ember Hollow";

    $("characterScreen").classList.add("hidden");
    $("gameScreen").classList.remove("hidden");

    logMessage(
        hero.name + " begins the journey."
    );

    showScene("emberStart");

}


/* =========================
   STORY ENGINE
========================= */

function showScene(scene) {

    $("choices").innerHTML = "";

    let title = "";
    let type = "";
    let story = "";

    /* EMBER HOLLOW */

    if (scene === "emberStart") {

        title = "Ember Hollow";
        type = "Village";

        hero.location = "Ember Hollow";

        story =
            "You awaken beside the ancient road leading into Ember Hollow.\n\n" +
            "Smoke rises from the distant village.\n\n" +
            "A wounded traveler watches you from beside the road.";

        choice(
            "Speak with the traveler",
            function() {
                showScene("traveler");
            }
        );

        choice(
            "Enter the village",
            function() {
                showScene("village");
            }
        );

    }


    else if (scene === "traveler") {

        title = "Ember Hollow";
        type = "Warning";

        story =
            "The traveler speaks quietly.\n\n" +
            "\"The forest isn't safe. Something has awakened beneath the old ruins.\"\n\n" +
            "They point toward the forest road.";

        choice(
            "Enter the Whispering Forest",
            function() {
                showScene("forest");
            }
        );

        choice(
            "Return to the village",
            function() {
                showScene("village");
            }
        );

    }


    else if (scene === "village") {

        title = "Ember Hollow";
        type = "Village";

        story =
            "The village is tense.\n\n" +
            "People whisper about strange lights coming from the forest.";

        choice(
            "Leave for the Whispering Forest",
            function() {
                showScene("forest");
            }
        );

        choice(
            "Search the village",
            function() {

                hero.gold += 5;

                logMessage(
                    "You find 5 gold in the village."
                );

                showScene("villageSearch");
            }
        );

    }


    else if (scene === "villageSearch") {

        title = "Ember Hollow";
        type = "Village";

        story =
            "You find a few coins beneath an abandoned stall.\n\n" +
            "The forest road waits outside the gate.";

        choice(
            "Leave for the forest",
            function() {
                showScene("forest");
            }
        );

    }


    /* FOREST */

    else if (scene === "forest") {

        title = "Whispering Forest";
        type = "Wilderness";

        hero.location = "Whispering Forest";

        story =
            "The trees close around you.\n\n" +
            "You hear movement among the branches.\n\n" +
            "An old trail leads deeper into the forest.";

        choice(
            "Investigate the movement",
            function() {

                startCombat(
                    {
                        name: "Ash Wolf",
                        hp: 35,
                        maxHp: 35,
                        attack: 8,
                        defense: 3,
                        xp: 35,
                        gold: 10,
                        description:
                            "A wolf covered in gray ash steps from the trees."
                    },
                    "forestAfterWolf"
                );

            }
        );

        choice(
            "Follow the old trail",
            function() {
                showScene("forestTrail");
            }
        );

        choice(
            "Return to Ember Hollow",
            function() {
                showScene("village");
            }
        );

    }


    else if (scene === "forestAfterWolf") {

        title = "Whispering Forest";
        type = "Hidden Trail";

        hero.location = "Whispering Forest";

        story =
            "The Ash Wolf falls.\n\n" +
            "Behind it you discover an old stone trail leading toward broken towers.";

        choice(
            "Follow the trail",
            function() {
                showScene("ruins");
            }
        );

        choice(
            "Return to Ember Hollow",
            function() {
                showScene("village");
            }
        );

    }


    else if (scene === "forestTrail") {

        title = "Whispering Forest";
        type = "Ancient Trail";

        story =
            "The trail leads toward enormous stone ruins hidden beneath the trees.";

        choice(
            "Approach the ruins",
            function() {
                showScene("ruins");
            }
        );

        choice(
            "Return to the forest",
            function() {
                showScene("forest");
            }
        );

    }


    /* RUINS */

    else if (scene === "ruins") {

        title = "Ancient Ruins";
        type = "Forgotten Kingdom";

        hero.location = "Ancient Ruins";

        story =
            "Broken towers surround a massive stone doorway.\n\n" +
            "A faint red glow pulses beneath the ruins.";

        choice(
            "Search the ruins",
            function() {

                hero.gold += 15;
                hero.inventory["Old Coin"]++;

                logMessage(
                    "You find 15 gold and an Old Coin."
                );

                showScene("ruinsSearch");
            }
        );

        choice(
            "Enter the underground passage",
            function() {
                showScene("ashenEntrance");
            }
        );

    }


    else if (scene === "ruinsSearch") {

        title = "Ancient Ruins";
        type = "Forgotten Kingdom";

        story =
            "You uncover an ancient coin bearing the symbol of a crowned flame.\n\n" +
            "The underground passage waits below.";

        choice(
            "Enter the underground passage",
            function() {
                showScene("ashenEntrance");
            }
        );

    }


    /* =========================
       ASHEN DEPTHS
    ========================= */

    else if (scene === "ashenEntrance") {

        title = "Ashen Depths";
        type = "Underground";

        hero.location = "Ashen Depths";

        story =
            "You descend beneath the Ancient Ruins.\n\n" +
            "The stairs finally end in a massive underground cavern.\n\n" +
            "Three passages lead away from the chamber.";

        choice(
            "Follow the red light",
            function() {
                showScene("redTunnel");
            }
        );

        choice(
            "Enter the dark passage",
            function() {
                showScene("darkPassage");
            }
        );

        choice(
            "Follow the underground river",
            function() {
                showScene("waterCavern");
            }
        );

    }


    /* RED ROUTE */

    else if (scene === "redTunnel") {

        title = "Ashen Depths";
        type = "Ember Tunnel";

        story =
            "The walls glow with a deep red light.\n\n" +
            "A burning spirit rises from ancient armor.";

        choice(
            "Fight the Ember Wraith",
            function() {

                startCombat(
                    {
                        name: "Ember Wraith",
                        hp: 55,
                        maxHp: 55,
                        attack: 12,
                        defense: 6,
                        xp: 60,
                        gold: 25,
                        description:
                            "A burning spirit forged from the remains of a forgotten warrior."
                    },
                    "redTunnelComplete"
                );

            }
        );

        choice(
            "Return to the main chamber",
            function() {
                showScene("ashenEntrance");
            }
        );

    }


    else if (scene === "redTunnelComplete") {

        title = "Ashen Depths";
        type = "Sealed Chamber";

        story =
            "The Ember Wraith is defeated.\n\n" +
            "The flames vanish and reveal an ancient doorway.";

        choice(
            "Enter the doorway",
            function() {
                showScene("guardianChamber");
            }
        );

        choice(
            "Return to the main chamber",
            function() {
                showScene("ashenEntrance");
            }
        );

    }


    /* DARK ROUTE */

    else if (scene === "darkPassage") {

        title = "Ashen Depths";
        type = "The Black Passage";

        story =
            "The darkness is absolute.\n\n" +
            "Your hand finds an ancient weapon resting on a stone altar.";

        choice(
            "Take the Moonblade",
            function() {

                hero.weapon = "Moonblade";

                logMessage(
                    "You recover the Moonblade."
                );

                showScene("moonbladeFound");
            }
        );

        choice(
            "Leave the weapon",
            function() {
                showScene("darkPassageEnd");
            }
        );

    }


    else if (scene === "moonbladeFound") {

        title = "Ashen Depths";
        type = "Ancient Altar";

        story =
            "The Moonblade hums in your hand.\n\n" +
            "A distant roar shakes the cavern.";

        choice(
            "Follow the roar",
            function() {
                showScene("guardianChamber");
            }
        );

    }


    else if (scene === "darkPassageEnd") {

        title = "Ashen Depths";
        type = "Ancient Passage";

        story =
            "You continue through the darkness until the passage opens into a massive chamber.";

        choice(
            "Enter the chamber",
            function() {
                showScene("guardianChamber");
            }
        );

    }


    /* WATER ROUTE */

    else if (scene === "waterCavern") {

        title = "Ashen Depths";
        type = "Underground River";

        story =
            "A pale blue spring flows through a quiet cavern.\n\n" +
            "An ancient shrine stands beside the water.";

        choice(
            "Drink from the spring",
            function() {

                hero.hp = hero.maxHp;

                logMessage(
                    "The spring restores your health."
                );

                showScene("waterComplete");
            }
        );

        choice(
            "Search the shrine",
            function() {

                hero.inventory.Potion += 2;

                logMessage(
                    "You find two Potions."
                );

                showScene("waterComplete");
            }
        );

    }


    else if (scene === "waterComplete") {

        title = "Ashen Depths";
        type = "Underground River";

        story =
            "The cavern begins to shake.\n\n" +
            "Something enormous is moving beyond the stone wall.";

        choice(
            "Follow the passage",
            function() {
                showScene("guardianChamber");
            }
        );

    }


    /* GUARDIAN */

    else if (scene === "guardianChamber") {

        title = "Ashen Depths";
        type = "Guardian's Chamber";

        story =
            "A colossal chamber opens before you.\n\n" +
            "A black flame burns above a stone platform.\n\n" +
            "An armored guardian rises from the shadows.\n\n" +
            "\"No mortal walks beyond this chamber.\"";

        choice(
            "Challenge the Ashen Guardian",
            function() {

                startCombat(
                    {
                        name: "Ashen Guardian",
                        hp: 120,
                        maxHp: 120,
                        attack: 18,
                        defense: 10,
                        xp: 150,
                        gold: 100,
                        description:
                            "An ancient guardian created to protect whatever lies beyond the depths."
                    },
                    "guardianDefeated"
                );

            }
        );

        choice(
            "Search the chamber",
            function() {
                showScene("guardianSearch");
            }
        );

    }


    else if (scene === "guardianSearch") {

        title = "Ashen Depths";
        type = "Hidden Passage";

        story =
            "You discover a circular slot in the wall.\n\n" +
            "It matches the Old Coin found in the Ancient Ruins.";

        if (hero.inventory["Old Coin"] > 0) {

            choice(
                "Insert the Old Coin",
                function() {

                    hero.inventory["Old Coin"]--;

                    logMessage(
                        "The ancient door opens."
                    );

                    showScene("hiddenChamber");
                }
            );

        } else {

            story +=
                "\n\nYou don't have the required coin.";

        }

        choice(
            "Return to the guardian",
            function() {
                showScene("guardianChamber");
            }
        );

    }


    /* HIDDEN CHAMBER */

    else if (scene === "hiddenChamber") {

        title = "Ashen Depths";
        type = "Hidden Chamber";

        story =
            "A crystal rests upon an ancient pedestal.\n\n" +
            "Its light illuminates images of kingdoms falling beneath a black banner.";

        choice(
            "Take the Ashen Crystal",
            function() {

                hero.inventory["Ashen Crystal"] = 1;

                logMessage(
                    "You obtain the Ashen Crystal."
                );

                showScene("depthsExit");
            }
        );

        choice(
            "Leave the crystal",
            function() {
                showScene("guardianChamber");
            }
        );

    }


    /* GUARDIAN DEFEATED */

    else if (scene === "guardianDefeated") {

        title = "Ashen Depths";
        type = "Victory";

        hero.location = "Ashen Depths";

        story =
            "The Ashen Guardian crashes to the ground.\n\n" +
            "The black flame turns silver.\n\n" +
            "Behind the guardian, a massive gate slowly opens.\n\n" +
            "For the first time, you see sunlight beyond the depths.";

        choice(
            "Leave the Ashen Depths",
            function() {
                showScene("depthsExit");
            }
        );

    }


    /* EXIT */

    else if (scene === "depthsExit") {

        title = "Beyond the Ashen Depths";
        type = "The Emberlands";

        hero.location = "The Emberlands";

        story =
            "You climb the ancient stairs and emerge on the far side of the mountains.\n\n" +
            "The Emberlands stretch before you.\n\n" +
            "Far in the distance stands a massive fortress surrounded by black smoke.\n\n" +
            "Whatever awakened beneath the ruins is connected to that fortress.\n\n" +
            "Your journey continues.";

        choice(
            "Approach the distant fortress",
            function() {
                showScene("fortressRoad");
            }
        );

        choice(
            "Rest and recover",
            function() {

                hero.hp = hero.maxHp;

                logMessage(
                    "You rest and recover completely."
                );

                updateStats();
            }
        );

    }


    /* BEYOND */

    else if (scene === "fortressRoad") {

        title = "The Emberlands";
        type = "Unknown Territory";

        hero.location = "The Emberlands";

        story =
            "The road winds across a barren landscape.\n\n" +
            "The distant fortress grows larger with every step.\n\n" +
            "A strange symbol appears burned into the road ahead.\n\n" +
            "It is the same crowned flame you saw beneath the ruins.";

        choice(
            "Continue toward the fortress",
            function() {

                hero.gold += 10;

                logMessage(
                    "You find 10 gold beside the ruined road."
                );

                showScene("fortressGate");
            }
        );

        choice(
            "Rest",
            function() {

                hero.hp = hero.maxHp;

                logMessage(
                    "You recover your strength."
                );

                updateStats();
            }
        );

    }


    else if (scene === "fortressGate") {

        title = "The Black Fortress";
        type = "New Region";

        hero.location = "Black Fortress";

        story =
            "The road ends at an enormous fortress of black stone.\n\n" +
            "Two towers rise above the gate.\n\n" +
            "A red light burns in the highest window.\n\n" +
            "The next chapter of your adventure waits beyond these walls.";

        choice(
            "Enter the fortress",
            function() {

                logMessage(
                    "You enter the Black Fortress."
                );

                showScene("fortressInside");
            }
        );

    }


    else if (scene === "fortressInside") {

        title = "Black Fortress";
        type = "Unknown Territory";

        story =
            "The fortress is silent.\n\n" +
            "Three doors stand before you.\n\n" +
            "One bears the symbol of a crown.\n" +
            "One bears the symbol of a sword.\n" +
            "One bears the symbol of a flame.\n\n" +
            "The road ahead has finally opened.";

        choice(
            "Continue",
            function() {

                hero.gold += 20;

                logMessage(
                    "You discover 20 gold inside the fortress."
                );

                showScene("fortressInside");
            }
        );

    }


    $("locationTitle").textContent = title;
    $("locationType").textContent = type;
    $("storyText").textContent = story;

    updateStats();

}


/* =========================
   CHOICES
========================= */

function choice(text, action) {

    const button = document.createElement("button");

    button.textContent = text;

    button.onclick = action;

    $("choices").appendChild(button);

}


/* =========================
   COMBAT
========================= */

function startCombat(enemy, destination) {

    currentEnemy = {
        ...enemy
    };

    returnScene = destination;

    $("gameScreen").classList.add("hidden");

    $("combatScreen").classList.remove("hidden");

    $("enemyName").textContent =
        currentEnemy.name;

    $("enemyDescription").textContent =
        currentEnemy.description;

    $("combatMessage").textContent =
        "The battle begins!";

    updateCombat();

}


function weaponBonus() {

    if (hero.weapon === "Moonblade") return 12;
    if (hero.weapon === "Ember Staff") return 9;
    if (hero.weapon === "Shadow Dagger") return 7;
    if (hero.weapon === "Iron Sword") return 4;

    return 0;

}


function armorBonus() {

    if (hero.armor === "Holy Vestments") return 7;
    if (hero.armor === "Iron Armor") return 6;
    if (hero.armor === "Shadow Leather") return 4;
    if (hero.armor === "Ranger Cloak") return 3;

    return 0;

}


function attackEnemy() {

    if (!currentEnemy) return;

    let damage =
        hero.baseAttack +
        weaponBonus() -
        currentEnemy.defense;

    damage +=
        Math.floor(Math.random() * 7) - 3;

    damage = Math.max(2, damage);

    currentEnemy.hp -= damage;

    $("combatMessage").textContent =
        "You deal " +
        damage +
        " damage.";

    logMessage(
        "You hit " +
        currentEnemy.name +
        " for " +
        damage +
        " damage."
    );

    if (currentEnemy.hp <= 0) {

        winCombat();

        return;
    }

    enemyAttack();

    updateCombat();

}


function enemyAttack() {

    let damage =
        currentEnemy.attack -
        hero.baseDefense -
        armorBonus();

    damage +=
        Math.floor(Math.random() * 5) - 2;

    damage = Math.max(1, damage);

    hero.hp -= damage;

    $("combatMessage").textContent +=
        "\nThe enemy hits you for " +
        damage +
        " damage.";

    logMessage(
        currentEnemy.name +
        " hits you for " +
        damage +
        " damage."
    );

    if (hero.hp <= 0) {

        hero.hp = 1;

        $("combatMessage").textContent +=
            "\nYou barely survive.";

    }

}


function defendTurn() {

    if (!currentEnemy) return;

    let damage =
        currentEnemy.attack -
        hero.baseDefense -
        armorBonus();

    damage = Math.max(
        1,
        Math.floor(damage / 2)
    );

    hero.hp -= damage;

    $("combatMessage").textContent =
        "You defend and take only " +
        damage +
        " damage.";

    if (hero.hp <= 0) {

        hero.hp = 1;

    }

    updateCombat();

}


function usePotion() {

    if (hero.inventory.Potion <= 0) {

        $("combatMessage").textContent =
            "You have no Potions.";

        return;
    }

    if (hero.hp >= hero.maxHp) {

        $("combatMessage").textContent =
            "Your health is already full.";

        return;
    }

    hero.inventory.Potion--;

    const heal = 30;

    hero.hp =
        Math.min(
            hero.maxHp,
            hero.hp + heal
        );

    $("combatMessage").textContent =
        "You recover " +
        heal +
        " HP.";

    logMessage(
        "You use a Potion."
    );

    enemyAttack();

    updateCombat();

}


function winCombat() {

    const defeated = currentEnemy;

    hero.xp += defeated.xp;
    hero.gold += defeated.gold;

    logMessage(
        "You defeated " +
        defeated.name +
        "! +" +
        defeated.xp +
        " XP, +" +
        defeated.gold +
        " gold."
    );

    levelCheck();

    currentEnemy = null;

    $("combatScreen").classList.add("hidden");

    $("gameScreen").classList.remove("hidden");

    $("combatMessage").textContent = "";

    /*
       IMPORTANT:
       This is the fixed progression.
       The battle sends the player directly
       to the scene specified when combat began.
    */

    showScene(returnScene);

}


/* =========================
   LEVELING
========================= */

function levelCheck() {

    while (hero.xp >= hero.nextXp) {

        hero.xp -= hero.nextXp;

        hero.level++;

        hero.nextXp =
            Math.floor(hero.nextXp * 1.5);

        hero.maxHp += 10;

        hero.hp = hero.maxHp;

        hero.baseAttack += 2;

        hero.baseDefense += 2;

        logMessage(
            "LEVEL UP! You are now level " +
            hero.level +
            "."
        );

    }

}


/* =========================
   COMBAT DISPLAY
========================= */

function updateCombat() {

    if (!currentEnemy) return;

    $("enemyHP").textContent =
        Math.max(0, currentEnemy.hp);

    $("enemyMaxHP").textContent =
        currentEnemy.maxHp;

    $("enemyHPBar").style.width =
        Math.max(
            0,
            currentEnemy.hp /
            currentEnemy.maxHp *
            100
        ) + "%";

    $("combatHeroHP").textContent =
        Math.max(0, hero.hp);

    $("combatHeroMaxHP").textContent =
        hero.maxHp;

    $("heroHPBar").style.width =
        Math.max(
            0,
            hero.hp /
            hero.maxHp *
            100
        ) + "%";

}


/* =========================
   HERO DISPLAY
========================= */

function updateStats() {

    $("statName").textContent =
        hero.name;

    $("statLevel").textContent =
        hero.level;

    $("statHP").textContent =
        hero.hp +
        " / " +
        hero.maxHp;

    $("statAttack").textContent =
        hero.baseAttack +
        weaponBonus();

    $("statDefense").textContent =
        hero.baseDefense +
        armorBonus();

    $("statGold").textContent =
        hero.gold;

    $("statXP").textContent =
        hero.xp +
        " / " +
        hero.nextXp;

    $("statWeapon").textContent =
        hero.weapon;

    $("statArmor").textContent =
        hero.armor;

    $("statLocation").textContent =
        hero.location;

    updateInventory();

}


function updateInventory() {

    const container =
        $("inventory");

    container.innerHTML = "";

    const items =
        Object.keys(hero.inventory);

    items.forEach(function(item) {

        const div =
            document.createElement("div");

        div.className = "item";

        div.textContent =
            item +
            ": " +
            hero.inventory[item];

        container.appendChild(div);

    });

}


/* =========================
   LOG
========================= */

function logMessage(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    $("log").prepend(div);

}

</script>

</body>
