<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ashen Realms: Pocket Edition</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #0b0b0b;
    color: #eee;
    font-family: Georgia, "Times New Roman", serif;
}

#game {
    max-width: 720px;
    margin: auto;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #302419 0%, #17120e 42%, #090909 100%);
    padding-bottom: 35px;
}

header {
    text-align: center;
    padding: 22px 15px 14px;
    border-bottom: 1px solid #5a442c;
}

h1 {
    margin: 0;
    color: #e6b55b;
    font-size: 31px;
}

.subtitle {
    margin-top: 5px;
    color: #9f9381;
    font-size: 14px;
}

#screen {
    padding: 17px;
}

.panel {
    background: rgba(25, 21, 17, .96);
    border: 1px solid #58432c;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
}

h2 {
    margin-top: 0;
    color: #e0aa4e;
}

h3 {
    color: #c99b55;
}

.story {
    line-height: 1.7;
    color: #ddd;
}

.muted {
    color: #958a7b;
}

.success {
    color: #82bd83;
}

.warning {
    color: #d4a14d;
}

.enemy {
    color: #df7063;
}

.gold {
    color: #e7b64e;
}

button {
    width: 100%;
    padding: 14px 12px;
    margin: 6px 0;
    border-radius: 9px;
    border: 1px solid #735633;
    background: linear-gradient(#483720, #2c2218);
    color: #f2dfb6;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

button.primary {
    background: linear-gradient(#815720, #4e3014);
    border-color: #b77d2d;
    color: #fff0c7;
}

button.good {
    background: linear-gradient(#2d4b31, #192c1b);
}

button.danger {
    background: linear-gradient(#6b2b24, #391713);
}

button.small-button {
    padding: 9px;
    font-size: 14px;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin: 5px 0 12px;
    border-radius: 7px;
    border: 1px solid #5c472f;
    background: #101010;
    color: #eee;
    font-size: 16px;
}

.center {
    text-align: center;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.stat {
    background: #151311;
    border: 1px solid #3b3026;
    border-radius: 7px;
    padding: 9px;
}

.stat span {
    display: block;
    color: #948a7b;
    font-size: 12px;
}

.stat strong {
    display: block;
    margin-top: 3px;
    font-size: 17px;
}

.bar {
    height: 12px;
    background: #281a18;
    border-radius: 10px;
    overflow: hidden;
    margin: 5px 0 10px;
}

.hp-fill {
    height: 100%;
    background: #a7473d;
    transition: width .3s;
}

.xp-fill {
    height: 100%;
    background: #b7832f;
    transition: width .3s;
}

.item {
    padding: 10px 0;
    border-bottom: 1px solid #332b24;
}

.item:last-child {
    border-bottom: 0;
}

.quest {
    border-left: 3px solid #8b642f;
    padding-left: 10px;
    margin-bottom: 12px;
}

.log {
    max-height: 210px;
    overflow-y: auto;
    background: #0b0b0b;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    line-height: 1.5;
}

.log div {
    padding: 4px 0;
    border-bottom: 1px solid #1c1c1c;
}

.badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 20px;
    background: #35291c;
    border: 1px solid #60482a;
    color: #d8b26c;
    font-size: 12px;
}

#toast {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    max-width: 90%;
    padding: 10px 15px;
    border-radius: 8px;
    background: #302419;
    border: 1px solid #806133;
    color: #f5dfad;
    display: none;
    z-index: 100;
    text-align: center;
}
</style>
</head>

<body>

<div id="game">

<header>
    <h1>Ashen Realms</h1>
    <div class="subtitle">Pocket Edition</div>
</header>

<div id="screen"></div>

</div>

<div id="toast"></div>

<script>

/* =========================================================
   ASHEN REALMS
   CHAPTER 1
========================================================= */

const screen = document.getElementById("screen");

let hero = createDefaultHero();

let combat = {
    active: false,
    enemy: null,
    location: "",
    log: []
};

const weapons = {
    "Rusty Sword": 0,
    "Iron Sword": 4,
    "Shadow Dagger": 7,
    "Ember Staff": 9,
    "Moonblade": 12
};

const armor = {
    "Traveler's Clothes": 0,
    "Ranger Cloak": 3,
    "Shadow Leather": 4,
    "Iron Armor": 6,
    "Holy Vestments": 7
};

const enemies = {

    "Ash Wolf": {
        hp: 35,
        attack: 8,
        defense: 3,
        xp: 30,
        gold: 10
    },

    "Ruins Goblin": {
        hp: 45,
        attack: 10,
        defense: 4,
        xp: 40,
        gold: 15
    },

    "Ember Wraith": {
        hp: 55,
        attack: 12,
        defense: 6,
        xp: 55,
        gold: 20
    },

    "Forest Brute": {
        hp: 70,
        attack: 14,
        defense: 7,
        xp: 75,
        gold: 25
    },

    "Ashen Guardian": {
        hp: 120,
        attack: 18,
        defense: 10,
        xp: 150,
        gold: 100,
        boss: true
    }
};

const companions = {

    "Lyra": {
        hp: 60,
        attack: 12,
        ability: "Quick Shot"
    },

    "Brom": {
        hp: 80,
        attack: 10,
        ability: "Shield Bash"
    },

    "Selene": {
        hp: 45,
        attack: 16,
        ability: "Arcane Burst"
    }
};


/* =========================================================
   HERO
========================================================= */

function createDefaultHero() {

    return {

        name: "",
        race: "Human",
        class: "Warrior",

        level: 1,
        xp: 0,
        nextXp: 100,

        hp: 100,
        maxHp: 100,

        baseAttack: 10,
        baseDefense: 10,

        gold: 25,

        weapon: "Rusty Sword",
        armor: "Traveler's Clothes",

        inventory: {
            Potion: 3
        },

        companions: [],

        location: "Ember Hollow",

        quests: {
            villageTrouble: {
                status: "active",
                progress: 0
            },

            forestMystery: {
                status: "locked",
                progress: 0
            },

            forgottenKingdom: {
                status: "locked",
                progress: 0
            },

            guardian: {
                status: "locked",
                progress: 0
            }
        },

        flags: {
            forestVisited: false,
            investigatedForest: false,
            foundMarker: false,
            followedTrail: false,
            ruinsUnlocked: false,
            ruinsEntered: false,
            ruinsTreasure: false,
            guardianDefeated: false,
            depthsUnlocked: false,
            chapterOneComplete: false
        }
    };
}


/* =========================================================
   UTILITY
========================================================= */

function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}

function toast(message) {

    const el = document.getElementById("toast");

    el.textContent = message;
    el.style.display = "block";

    setTimeout(() => {
        el.style.display = "none";
    }, 1800);
}

function saveGame() {

    localStorage.setItem(
        "ashenRealmsSave",
        JSON.stringify(hero)
    );

    toast("Game saved.");
}

function loadGame() {

    const saved = localStorage.getItem("ashenRealmsSave");

    if (!saved) {
        toast("No saved game found.");
        return;
    }

    try {

        hero = JSON.parse(saved);

        combat.active = false;
        combat.enemy = null;

        showGame();

        toast("Game loaded.");

    } catch (error) {

        toast("Save data could not be loaded.");
    }
}

function addItem(item, amount = 1) {

    if (!hero.inventory[item]) {
        hero.inventory[item] = 0;
    }

    hero.inventory[item] += amount;
}

function hasCompanion(name) {
    return hero.companions.includes(name);
}

function weaponPower() {
    return weapons[hero.weapon] || 0;
}

function armorPower() {
    return armor[hero.armor] || 0;
}

function attackPower() {
    return hero.baseAttack + weaponPower();
}

function defensePower() {
    return hero.baseDefense + armorPower();
}

function heal(amount) {

    const before = hero.hp;

    hero.hp = Math.min(
        hero.maxHp,
        hero.hp + amount
    );

    return hero.hp - before;
}


/* =========================================================
   TITLE
========================================================= */

function titleScreen() {

    screen.innerHTML = `

        <div class="panel center">

            <h2>The Emberlands Await</h2>

            <p class="story">
                The old kingdoms have fallen.
                The Emberlands burn beneath forgotten skies.
                Your legend begins now.
            </p>

            <button class="primary" onclick="createHeroScreen()">
                Begin Adventure
            </button>

            <button onclick="createHeroScreen()">
                Create Your Hero
            </button>

            <button onclick="loadGame()">
                Continue
            </button>

        </div>

        <div class="panel">

            <h3>Chapter I</h3>

            <p class="muted">
                Ember Hollow • Whispering Forest • Ancient Ruins
                • Ashen Depths
            </p>

        </div>
    `;
}


/* =========================================================
   CHARACTER CREATION
========================================================= */

const races = [
    "Human",
    "Elf",
    "Dwarf",
    "Halfling"
];

const classes = [
    "Warrior",
    "Ranger",
    "Mage",
    "Rogue",
    "Cleric"
];

function randomName() {

    const first = [
        "Alden",
        "Kael",
        "Rowan",
        "Elara",
        "Dorian",
        "Mira",
        "Thorne",
        "Elias",
        "Seren",
        "Aric"
    ];

    const last = [
        "Ashfall",
        "Ravenwood",
        "Emberborn",
        "Stone",
        "Nightwind",
        "Blackmere",
        "Dawnfire",
        "Ironwood"
    ];

    return randomItem(first) + " " + randomItem(last);
}

function createHeroScreen() {

    screen.innerHTML = `

        <div class="panel">

            <h2>Create Your Hero</h2>

            <label>Name</label>

            <input
                id="heroName"
                placeholder="Enter your name"
            >

            <button onclick="
                document.getElementById('heroName').value=randomName()
            ">
                Random Name
            </button>

            <label>Race</label>

            <select id="heroRace">
                ${races.map(r => `<option>${r}</option>`).join("")}
            </select>

            <label>Class</label>

            <select id="heroClass">
                ${classes.map(c => `<option>${c}</option>`).join("")}
            </select>

            <button onclick="randomHero()">
                Random Hero
            </button>

            <button
                class="primary"
                onclick="beginAdventure()"
            >
                Enter the Emberlands
            </button>

        </div>
    `;
}

function randomHero() {

    document.getElementById("heroName").value =
        randomName();

    document.getElementById("heroRace").value =
        randomItem(races);

    document.getElementById("heroClass").value =
        randomItem(classes);
}

function beginAdventure() {

    hero = createDefaultHero();

    hero.name =
        document.getElementById("heroName").value.trim()
        || randomName();

    hero.race =
        document.getElementById("heroRace").value;

    hero.class =
        document.getElementById("heroClass").value;

    applyClassStats();

    showGame();
}

function applyClassStats() {

    switch (hero.class) {

        case "Warrior":

            hero.maxHp = 125;
            hero.hp = 125;
            hero.baseAttack = 14;
            hero.baseDefense = 13;

            break;

        case "Ranger":

            hero.baseAttack = 15;
            hero.baseDefense = 12;

            break;

        case "Mage":

            hero.maxHp = 90;
            hero.hp = 90;
            hero.baseAttack = 18;
            hero.baseDefense = 10;

            break;

        case "Rogue":

            hero.baseAttack = 16;
            hero.baseDefense = 14;

            break;

        case "Cleric":

            hero.maxHp = 110;
            hero.hp = 110;
            hero.baseAttack = 12;
            hero.baseDefense = 15;

            break;
    }
}


/* =========================================================
   MAIN GAME
========================================================= */

function showGame() {

    if (combat.active) {

        renderCombat();

        return;
    }

    screen.innerHTML = `

        <div class="panel">

            <h2>${hero.name}</h2>

            <span class="badge">
                Level ${hero.level} ${hero.race} ${hero.class}
            </span>

            <br><br>

            <strong>
                HP ${hero.hp} / ${hero.maxHp}
            </strong>

            <div class="bar">
                <div
                    class="hp-fill"
                    style="width:${Math.max(0, hero.hp / hero.maxHp * 100)}%"
                ></div>
            </div>

            <strong>
                XP ${hero.xp} / ${hero.nextXp}
            </strong>

            <div class="bar">
                <div
                    class="xp-fill"
                    style="width:${hero.xp / hero.nextXp * 100}%"
                ></div>
            </div>

            <div class="stat-grid">

                <div class="stat">
                    <span>Attack</span>
                    <strong>${attackPower()}</strong>
                </div>

                <div class="stat">
                    <span>Defense</span>
                    <strong>${defensePower()}</strong>
                </div>

                <div class="stat">
                    <span>Gold</span>
                    <strong class="gold">${hero.gold}</strong>
                </div>

                <div class="stat">
                    <span>Location</span>
                    <strong>${hero.location}</strong>
                </div>

            </div>

        </div>

        <div class="panel">

            ${renderLocationStory()}

        </div>

        <div class="panel">

            <h3>Actions</h3>

            ${renderLocationActions()}

        </div>

        <div class="panel">

            <h3>Character</h3>

            <button onclick="heroSheet()">
                Hero Sheet
            </button>

            <button onclick="inventoryScreen()">
                Inventory
            </button>

            <button onclick="questLog()">
                Quest Log
            </button>

            <button onclick="companionsScreen()">
                Companions
            </button>

        </div>

        <div class="panel">

            <button class="good" onclick="saveGame()">
                Save Game
            </button>

            <button onclick="titleScreen()">
                Title Screen
            </button>

        </div>
    `;
}


/* =========================================================
   LOCATION STORY
========================================================= */

function renderLocationStory() {

    if (hero.location === "Ember Hollow") {

        return `

            <h2>Ember Hollow</h2>

            <p class="story">
                Smoke rises from the rooftops of Ember Hollow.
                The villagers are frightened.
            </p>

            <p class="story">
                Something has been stalking the roads beyond
                the village walls.
            </p>

            <p class="story">
                An old hunter told you that the tracks disappear
                into the Whispering Forest.
            </p>

        `;
    }

    if (hero.location === "Whispering Forest") {

        return `

            <h2>Whispering Forest</h2>

            <p class="story">
                The trees close around you.
                Their branches twist together overhead.
            </p>

            <p class="story">
                The forest seems to whisper your name.
            </p>

        `;
    }

    if (hero.location === "Ancient Ruins") {

        return `

            <h2>Ancient Ruins</h2>

            <p class="story">
                Broken towers rise from the earth.
                The ruins were once part of a kingdom erased
                from every modern map.
            </p>

            <p class="story">
                Something ancient is moving beneath them.
            </p>

        `;
    }

    if (hero.location === "Ashen Depths") {

        return `

            <h2>The Ashen Depths</h2>

            <p class="story">
                The world above feels impossibly distant.
            </p>

            <p class="story">
                Ash drifts through underground corridors where
                no wind should exist.
            </p>

        `;
    }

    return `
        <h2>${hero.location}</h2>
        <p class="story">
            The road disappears into darkness.
        </p>
    `;
}


/* =========================================================
   LOCATION ACTIONS
========================================================= */

function renderLocationActions() {

    if (hero.location === "Ember Hollow") {

        return `

            <button
                class="primary"
                onclick="forestIntro()"
            >
                Explore Forest
            </button>

            ${
                hero.flags.ruinsUnlocked
                ?
                `
                <button onclick="enterRuins()">
                    Travel to Ancient Ruins
                </button>
                `
                :
                ""
            }

            <button onclick="restAtHollow()">
                Rest at Ember Hollow
            </button>

            <button onclick="blacksmith()">
                Visit Blacksmith
            </button>

        `;
    }

    if (hero.location === "Whispering Forest") {

        return `

            <button
                class="primary"
                onclick="forestExplore()"
            >
                Explore the Forest
            </button>

            <button onclick="followOldTrail()">
                Follow the Old Trail
            </button>

            <button onclick="searchMarker()">
                Search for Clues
            </button>

            <button onclick="returnToHollow()">
                Return to Ember Hollow
            </button>

        `;
    }

    if (hero.location === "Ancient Ruins") {

        return `

            <button
                class="primary"
                onclick="ruinsExplore()"
            >
                Explore the Ruins
            </button>

            <button onclick="ruinsChamber()">
                Search the Lower Chambers
            </button>

            <button onclick="returnToHollow()">
                Return to Ember Hollow
            </button>

        `;
    }

    if (hero.location === "Ashen Depths") {

        return `

            <button
                class="primary"
                onclick="depthsExplore()"
            >
                Explore the Ashen Depths
            </button>

            <button onclick="returnToHollow()">
                Return to Ember Hollow
            </button>

        `;
    }

    return `
        <button onclick="showGame()">
            Continue
        </button>
    `;
}


/* =========================================================
   EMBER HOLLOW
========================================================= */

function restAtHollow() {

    hero.location = "Ember Hollow";

    hero.hp = hero.maxHp;

    showGame();

    toast("You rest beside the village fire.");
}

function blacksmith() {

    screen.innerHTML = `

        <div class="panel">

            <h2>The Village Blacksmith</h2>

            <p class="story">
                The blacksmith examines your equipment.
            </p>

            <p class="gold">
                Gold: ${hero.gold}
            </p>

            <button onclick="buyWeapon('Iron Sword',50)">
                Iron Sword — 50 Gold
            </button>

            <button onclick="buyWeapon('Shadow Dagger',90)">
                Shadow Dagger — 90 Gold
            </button>

            <button onclick="buyWeapon('Ember Staff',120)">
                Ember Staff — 120 Gold
            </button>

            <button onclick="buyArmor('Ranger Cloak',60)">
                Ranger Cloak — 60 Gold
            </button>

            <button onclick="buyArmor('Iron Armor',75)">
                Iron Armor — 75 Gold
            </button>

            <button onclick="buyPotion()">
                Potion — 15 Gold
            </button>

            <button onclick="showGame()">
                Leave
            </button>

        </div>
    `;
}

function buyWeapon(name, cost) {

    if (hero.gold < cost) {

        toast("Not enough gold.");

        return;
    }

    hero.gold -= cost;

    hero.weapon = name;

    toast(name + " equipped.");

    blacksmith();
}

function buyArmor(name, cost) {

    if (hero.gold < cost) {

        toast("Not enough gold.");

        return;
    }

    hero.gold -= cost;

    hero.armor = name;

    toast(name + " equipped.");

    blacksmith();
}

function buyPotion() {

    if (hero.gold < 15) {

        toast("Not enough gold.");

        return;
    }

    hero.gold -= 15;

    addItem("Potion");

    toast("Potion purchased.");

    blacksmith();
}


/* =========================================================
   FOREST INTRO
========================================================= */

function forestIntro() {

    hero.location = "Whispering Forest";

    hero.flags.forestVisited = true;

    hero.quests.villageTrouble.progress = 1;

    hero.quests.forestMystery.status = "active";

    screen.innerHTML = `

        <div class="panel">

            <h2>The Whispering Forest</h2>

            <p class="story">
                You leave Ember Hollow behind and enter the forest.
            </p>

            <p class="story">
                The trail is almost invisible beneath the roots.
            </p>

            <p class="story">
                Suddenly, something crashes through the bushes.
            </p>

            <button
                class="primary"
                onclick="forestInvestigate()"
            >
                Investigate the Movement
            </button>

            <button onclick="followOldTrail()">
                Follow the Old Trail
            </button>

            <button onclick="returnToHollow()">
                Return to Ember Hollow
            </button>

        </div>
    `;
}


/* =========================================================
   FOREST EVENTS
========================================================= */

function forestInvestigate() {

    hero.flags.investigatedForest = true;

    const roll = Math.random();

    if (roll < .5) {

        startCombat(
            "Ash Wolf",
            "Whispering Forest"
        );

        return;
    }

    if (roll < .8) {

        startCombat(
            "Forest Brute",
            "Whispering Forest"
        );

        return;
    }

    forestDiscovery();
}

function forestExplore() {

    const roll = Math.random();

    if (roll < .42) {

        startCombat(
            "Ash Wolf",
            "Whispering Forest"
        );

        return;
    }

    if (roll < .62) {

        startCombat(
            "Forest Brute",
            "Whispering Forest"
        );

        return;
    }

    if (roll < .82) {

        forestTreasure();

        return;
    }

    forestDiscovery();
}

function forestTreasure() {

    const gold =
        10 + Math.floor(Math.random() * 21);

    hero.gold += gold;

    addItem("Potion");

    screen.innerHTML = `

        <div class="panel">

            <h2>Forgotten Satchel</h2>

            <p class="story">
                Beneath a fallen tree you discover an old
                traveler's satchel.
            </p>

            <p class="success">
                You found ${gold} gold and a Potion.
            </p>

            <button
                class="primary"
                onclick="showGame()"
            >
                Continue
            </button>

        </div>
    `;
}

function forestDiscovery() {

    screen.innerHTML = `

        <div class="panel">

            <h2>The Stone Marker</h2>

            <p class="story">
                You discover a weathered stone marker buried
                beneath the roots.
            </p>

            <p class="story">
                A symbol of a burning crown is carved into
                the stone.
            </p>

            <p class="warning">
                THE KING STILL DREAMS.
            </p>

            <button
                class="primary"
                onclick="searchMarker()"
            >
                Examine the Marker
            </button>

        </div>
    `;
}

function searchMarker() {

/* =========================================================
   COMBAT
========================================================= */

function startCombat(enemyName, location) {

    const template = enemies[enemyName];

    combat.active = true;

    combat.location = location;

    combat.enemy = {

        name: enemyName,

        hp: template.hp,

        maxHp: template.hp,

        attack: template.attack,

        defense: template.defense,

        xp: template.xp,

        gold: template.gold,

        boss: template.boss || false
    };

    combat.log = [
        `You encounter the ${enemyName}.`
    ];

    renderCombat();
}

function addCombatLog(message) {

    combat.log.push(message);

    if (combat.log.length > 20) {

        combat.log.shift();
    }
}

function renderCombat() {

    if (!combat.active || !combat.enemy) {

        showGame();

        return;
    }

    const enemy = combat.enemy;

    screen.innerHTML = `

        <div class="panel">

            <h2>Combat</h2>

            <h3 class="enemy">
                ${enemy.name}
            </h3>

            <strong>
                HP ${enemy.hp} / ${enemy.maxHp}
            </strong>

            <div class="bar">
                <div
                    class="hp-fill"
                    style="width:${enemy.hp / enemy.maxHp * 100}%"
                ></div>
            </div>

            <h3>${hero.name}</h3>

            <strong>
                HP ${hero.hp} / ${hero.maxHp}
            </strong>

            <div class="bar">
                <div
                    class="hp-fill"
                    style="width:${hero.hp / hero.maxHp * 100}%"
                ></div>
            </div>

        </div>

        <div class="panel">

            <button
                class="primary"
                onclick="playerAttack()"
            >
                Attack
            </button>

            <button onclick="classAbility()">
                Class Ability
            </button>

            <button onclick="usePotionCombat()">
                Use Potion (${hero.inventory.Potion || 0})
            </button>

            ${
                hero.companions.length > 0
                ?
                `
                <button onclick="companionAttack()">
                    Companion Attack
                </button>
                `
                :
                ""
            }

            <button onclick="attemptFlee()">
                Flee
            </button>

        </div>

        <div class="panel">

            <h3>Battle Log</h3>

            <div class="log">

                ${combat.log.map(
                    message => `<div>${message}</div>`
                ).join("")}

            </div>

        </div>
    `;
}

function playerAttack() {

    if (!combat.active) return;

    let damage =
        attackPower()
        - combat.enemy.defense
        + Math.floor(Math.random() * 6);

    damage = Math.max(1, damage);

    const critical =
        Math.random() < .10;

    if (critical) {

        damage *= 2;

        addCombatLog(
            `Critical hit! You deal ${damage} damage.`
        );

    } else {

        addCombatLog(
            `You deal ${damage} damage.`
        );
    }

    combat.enemy.hp -= damage;

    if (combat.enemy.hp <= 0) {

        combat.enemy.hp = 0;

        victory();

        return;
    }

    enemyTurn();
}

function classAbility() {

    let damage = 0;
    let message = "";

    switch (hero.class) {

        case "Warrior":

            damage =
                attackPower()
                + 8
                - combat.enemy.defense;

            damage = Math.max(2, damage);

            message =
                `Power Strike deals ${damage} damage.`;

            break;

        case "Ranger":

            damage =
                attackPower()
                + 5
                - combat.enemy.defense;

            damage = Math.max(2, damage);

            message =
                `Quick Shot deals ${damage} damage.`;

            break;

        case "Mage":

            damage =
                attackPower()
                + 10;

            message =
                `Arcane Burst deals ${damage} damage.`;

            break;

        case "Rogue":

            damage =
                attackPower()
                + 6
                - combat.enemy.defense;

            damage = Math.max(2, damage);

            message =
                `Shadow Strike deals ${damage} damage.`;

            break;

        case "Cleric":

            const restored = heal(20);

            addCombatLog(
                `Holy Light restores ${restored} HP.`
            );

            enemyTurn();

            renderCombat();

            return;
    }

    combat.enemy.hp -= damage;

    addCombatLog(message);

    if (combat.enemy.hp <= 0) {

        combat.enemy.hp = 0;

        victory();

        return;
    }

    enemyTurn();
}

function companionAttack() {

    if (
        !combat.active ||
        hero.companions.length === 0
    ) return;

    const name =
        randomItem(hero.companions);

    const companion =
        companions[name];

    let damage =
        companion.attack
        - combat.enemy.defense
        + Math.floor(Math.random() * 5);

    damage = Math.max(1, damage);

    combat.enemy.hp -= damage;

    addCombatLog(
        `${name} uses ${companion.ability} for ${damage} damage.`
    );

    if (combat.enemy.hp <= 0) {

        combat.enemy.hp = 0;

        victory();

        return;
    }

    enemyTurn();
}

function usePotionCombat() {

    if (
        !hero.inventory.Potion ||
        hero.inventory.Potion <= 0
    ) {

        toast("You have no potions.");

        return;
    }

    hero.inventory.Potion--;

    const restored = heal(30);

    addCombatLog(
        `You drink a Potion and restore ${restored} HP.`
    );

    enemyTurn();
}

function enemyTurn() {

    let damage =
        combat.enemy.attack
        - defensePower()
        + Math.floor(Math.random() * 5);

    damage = Math.max(1, damage);

    hero.hp -= damage;

    addCombatLog(
        `${combat.enemy.name} deals ${damage} damage.`
    );

    if (hero.hp <= 0) {

        hero.hp = 0;

        defeat();

        return;
    }

    renderCombat();
}

function attemptFlee() {

    if (combat.enemy.boss) {

        addCombatLog(
            "You cannot flee from the Guardian."
        );

        enemyTurn();

        return;
    }

    if (Math.random() < .65) {

        combat.active = false;
        combat.enemy = null;

        hero.location =
            combat.location;

        screen.innerHTML = `

            <div class="panel">

                <h2>You Escape</h2>

                <p class="story">
                    You break away from the battle and
                    disappear into the darkness.
                </p>

                <button
                    class="primary"
                    onclick="showGame()"
                >
                    Continue
                </button>

            </div>
        `;

    } else {

        addCombatLog(
            "You fail to escape."
        );

        enemyTurn();
    }
}


/* =========================================================
   VICTORY
========================================================= */

function victory() {

    const enemy = combat.enemy;

    const xp = enemy.xp;
    const gold = enemy.gold;

    hero.xp += xp;
    hero.gold += gold;

    let special = "";

    if (enemy.name === "Ashen Guardian") {

        hero.flags.guardianDefeated = true;

        hero.flags.depthsUnlocked = true;

        hero.quests.guardian.status = "complete";

        hero.quests.guardian.progress = 1;

        hero.quests.forgottenKingdom.status = "complete";

        hero.flags.chapterOneComplete = true;

        hero.weapon = "Moonblade";

        special = `
            <p class="success">
                The legendary Moonblade has been recovered.
            </p>

            <p class="story">
                Behind the Guardian's throne,
                a staircase opens into darkness.
            </p>

            <p class="warning">
                THE ASHEN DEPTHS HAVE OPENED.
            </p>
        `;
    }

    const oldLevel = hero.level;

    checkLevelUp();

    combat.active = false;

    combat.enemy = null;

    screen.innerHTML = `

        <div class="panel">

            <h2>Victory</h2>

            <p class="success">
                You defeated the ${enemy.name}.
            </p>

            <p>
                XP gained:
                <strong>${xp}</strong>
            </p>

            <p class="gold">
                Gold gained:
                ${gold}
            </p>

            ${special}

            ${
                hero.level > oldLevel
                ?
                `
                <div class="panel">
                    <h3 class="success">
                        LEVEL UP!
                    </h3>

                    <p>
                        You are now level ${hero.level}.
                    </p>

                    <p>
                        Maximum HP increased.
                    </p>

                    <p>
                        Attack and Defense increased.
                    </p>
                </div>
                `
                :
                ""
            }

            <button
                class="primary"
                onclick="showGame()"
            >
                Continue
            </button>

        </div>
    `;
}

function checkLevelUp() {

    while (hero.xp >= hero.nextXp) {

        hero.xp -= hero.nextXp;

        hero.level++;

        hero.nextXp =
            Math.floor(hero.nextXp * 1.35);

        hero.maxHp += 10;

        hero.hp = hero.maxHp;

        hero.baseAttack += 2;

        hero.baseDefense += 2;
    }
}

function defeat() {

    combat.active = false;

    combat.enemy = null;

    hero.location = "Ember Hollow";

    hero.hp =
        Math.max(
            1,
            Math.floor(hero.maxHp * .25)
        );

    hero.gold =
        Math.max(0, hero.gold - 10);

    screen.innerHTML = `

        <div class="panel">

            <h2>Defeated</h2>

            <p class="story">
                Darkness overtakes you.
                When you awaken, you are lying beside
                the village fire in Ember Hollow.
            </p>

            <p class="muted">
                Some gold was lost while the villagers
                carried you home.
            </p>

            <button
                class="primary"
                onclick="showGame()"
            >
                Rise Again
            </button>

        </div>
    `;
}

                <span class="${
                    forest.status === "complete"
                    ? "success"
                    :
                    forest.status === "active"
                    ? "warning"
                    :
                    "muted"
                }">

                    ${
                        forest.status === "complete"
                        ? "COMPLETE"
                        :
                        forest.status === "active"
                        ? "ACTIVE"
                        :
                        "LOCKED"
                    }

                </span>

            </div>

            <div class="quest">

                <strong>
                    The Forgotten Kingdom
                </strong>

                <p class="muted">
                    Enter the Ancient Ruins and discover what
                    lies beneath them.
                </p>

                <span class="${
                    kingdom.status === "complete"
                    ? "success"
                    :
                    kingdom.status === "active"
                    ? "warning"
                    :
                    "muted"
                }">

                    ${
                        kingdom.status === "complete"
                        ? "COMPLETE"
                        :
                        kingdom.status === "active"
                        ? "ACTIVE"
                        :
                        "LOCKED"
                    }

                </span>

            </div>

            <div class="quest">

                <strong>
                    The Ashen Guardian
                </strong>

                <p class="muted">
                    Face the Guardian protecting the deepest
                    chamber of the ruins.
                </p>

                <span class="${
                    guardian.status === "complete"
                    ? "success"
                    :
                    guardian.status === "active"
                    ? "warning"
                    :
                    "muted"
                }">

                    ${
                        guardian.status === "complete"
                        ? "COMPLETE"
                        :
                        guardian.status === "active"
                        ? "ACTIVE"
                        :
                        "LOCKED"
                    }

                </span>

            </div>

            <button onclick="showGame()">
                Back
            </button>

        </div>
    `;
}


/* =========================================================
   COMPANIONS
========================================================= */

function companionsScreen() {

    screen.innerHTML = `

        <div class="panel">

            <h2>Companions</h2>

            ${
                hero.companions.length === 0

                ?

                `
                <p class="muted">
                    You currently travel alone.
                </p>
                `

                :

                hero.companions.map(name => {

                    const companion =
                        companions[name];

                    return `

                        <div class="item">

                            <strong>${name}</strong>

                            <p class="muted">
                                HP: ${companion.hp}<br>
                                Attack: ${companion.attack}<br>
                                Ability: ${companion.ability}
                            </p>

                        </div>
                    `;

                }).join("")
            }

            <button onclick="showGame()">
                Back
            </button>

        </div>
    `;
}


/* =========================================================
   START GAME
========================================================= */

titleScreen();

</script>

</body>
</html>
