<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ashen Realms: Pocket Edition</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #0d0d12;
    color: #eee;
    font-family: Georgia, serif;
}

#game {
    max-width: 700px;
    margin: auto;
    min-height: 100vh;
    padding: 18px;
}

h1, h2, h3 {
    text-align: center;
    color: #d9a441;
}

h1 {
    font-size: 32px;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    font-style: italic;
    margin-bottom: 25px;
}

.panel {
    background: #181820;
    border: 1px solid #393945;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,.35);
}

.story {
    line-height: 1.65;
    font-size: 17px;
    white-space: pre-line;
}

button {
    width: 100%;
    padding: 14px;
    margin: 7px 0;
    border: 1px solid #765b28;
    border-radius: 9px;
    background: #29231a;
    color: #f1d18a;
    font-size: 16px;
    font-family: Georgia, serif;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
    background: #3a301e;
}

button.primary {
    background: #60481d;
    color: white;
    border-color: #a47b31;
}

button.danger {
    background: #421f1f;
    border-color: #7c3838;
}

button.good {
    background: #203d2b;
    border-color: #417553;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 6px 0 12px;
    background: #0f0f14;
    color: white;
    border: 1px solid #444;
    border-radius: 7px;
    font-size: 16px;
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.stat {
    background: #101016;
    padding: 10px;
    border-radius: 7px;
    border: 1px solid #30303a;
}

.stat strong {
    color: #d9a441;
}

.hidden {
    display: none;
}

.log {
    max-height: 180px;
    overflow-y: auto;
    background: #0a0a0e;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    color: #bbb;
}

.log div {
    margin-bottom: 7px;
}

.enemy {
    border-color: #743737;
}

.enemy h3 {
    color: #d66b6b;
}

.location {
    text-align: center;
    color: #c79b4a;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.hpbar {
    height: 14px;
    background: #351818;
    border-radius: 10px;
    overflow: hidden;
    margin: 7px 0 12px;
}

.hpfill {
    height: 100%;
    background: #7c3030;
    width: 100%;
}

.item {
    padding: 8px;
    border-bottom: 1px solid #292932;
}

.center {
    text-align: center;
}
</style>
</head>

<body>

<div id="game">

    <!-- TITLE -->
    <section id="titleScreen">
        <div class="panel">
            <h1>Ashen Realms</h1>
            <div class="subtitle">Pocket Edition</div>

            <p class="story center">
                The old kingdoms have fallen.
                The Emberlands burn beneath forgotten skies.
                Your legend begins now.
            </p>

            <button class="primary" onclick="showCharacterCreation()">
                Begin Adventure
            </button>

            <button onclick="showCharacterCreation()">
                Create Your Hero
            </button>
        </div>
    </section>


    <!-- CHARACTER CREATION -->
    <section id="characterScreen" class="hidden">

        <div class="panel">
            <h2>Create Your Hero</h2>

            <label>Name</label>
            <input id="heroName" type="text" placeholder="Enter your name">

            <button onclick="randomName()">Random Name</button>

            <label>Race</label>
            <select id="heroRace">
                <option>Human</option>
                <option>Elf</option>
                <option>Dwarf</option>
                <option>Half-Elf</option>
                <option>Halfling</option>
            </select>

            <label>Class</label>
            <select id="heroClass">
                <option>Warrior</option>
                <option>Ranger</option>
                <option>Mage</option>
                <option>Rogue</option>
                <option>Cleric</option>
            </select>

            <button onclick="randomHero()">Random Hero</button>
            <button class="primary" onclick="startAdventure()">Continue</button>
        </div>

    </section>


    <!-- GAME -->
    <section id="gameScreen" class="hidden">

        <div class="panel">
            <h2 id="locationTitle">Ember Hollow</h2>
            <div id="locationType" class="location"></div>

            <div id="storyText" class="story"></div>

            <div id="choices"></div>
        </div>

        <div class="panel">
            <h3>Hero</h3>

            <div class="stat-grid">
                <div class="stat">
                    <strong>Name</strong><br>
                    <span id="statName"></span>
                </div>

                <div class="stat">
                    <strong>Level</strong><br>
                    <span id="statLevel"></span>
                </div>

                <div class="stat">
                    <strong>HP</strong><br>
                    <span id="statHP"></span>
                </div>

                <div class="stat">
                    <strong>Attack</strong><br>
                    <span id="statAttack"></span>
                </div>

                <div class="stat">
                    <strong>Defense</strong><br>
                    <span id="statDefense"></span>
                </div>

                <div class="stat">
                    <strong>Gold</strong><br>
                    <span id="statGold"></span>
                </div>

                <div class="stat">
                    <strong>XP</strong><br>
                    <span id="statXP"></span>
                </div>

                <div class="stat">
                    <strong>Weapon</strong><br>
                    <span id="statWeapon"></span>
                </div>

                <div class="stat">
                    <strong>Armor</strong><br>
                    <span id="statArmor"></span>
                </div>

                <div class="stat">
                    <strong>Location</strong><br>
                    <span id="statLocation"></span>
                </div>
            </div>
        </div>

        <div class="panel">
            <h3>Inventory</h3>
            <div id="inventory"></div>
        </div>

        <div class="panel">
            <h3>Adventure Log</h3>
            <div id="log" class="log"></div>
        </div>

    </section>


    <!-- COMBAT -->
    <section id="combatScreen" class="hidden">

        <div class="panel enemy">
            <h2 id="enemyName">Enemy</h2>

            <div>
                HP: <span id="enemyHP"></span> /
                <span id="enemyMaxHP"></span>
            </div>

            <div class="hpbar">
                <div id="enemyHPBar" class="hpfill"></div>
            </div>

            <p id="enemyDescription" class="story"></p>
        </div>

        <div class="panel">
            <h3>Your HP</h3>

            <div>
                <span id="combatHeroHP"></span> /
                <span id="combatHeroMaxHP"></span>
            </div>

            <div class="hpbar">
                <div id="heroHPBar" class="hpfill"></div>
            </div>

            <button class="danger" onclick="attackEnemy()">
                Attack
            </button>

            <button onclick="usePotion()">
                Use Potion
            </button>

            <button onclick="defendTurn()">
                Defend
            </button>

            <div id="combatMessage" class="story"></div>
        </div>

    </section>

</div>


<script>

let hero = {
    name: "",
    race: "Human",
    class: "Warrior",

    hp: 100,
    maxHp: 100,

    baseAttack: 10,
    baseDefense: 10,

    level: 1,
    xp: 0,
    nextXp: 100,
    gold: 25,

    weapon: "Rusty Sword",
    armor: "Traveler's Clothes",

    inventory: {
        Potion: 3,
        "Old Coin": 0
    },

    location: "Ember Hollow"
};

let currentEnemy = null;
let currentScene = "emberStart";
let ashDepthStage = 0;

const names = [
    "Alden",
    "Rowan",
    "Kael",
    "Elara",
    "Mira",
    "Thorne",
    "Lyra",
    "Bren",
    "Aric",
    "Selene",
    "Dorian",
    "Rhea"
];

const classBonuses = {
    Warrior: {
        maxHp: 25,
        attack: 4,
        defense: 3
    },

    Ranger: {
        maxHp: 0,
        attack: 5,
        defense: 2
    },

    Mage: {
        maxHp: -10,
        attack: 8,
        defense: 0
    },

    Rogue: {
        maxHp: 0,
        attack: 6,
        defense: 4
    },

    Cleric: {
        maxHp: 10,
        attack: 2,
        defense: 5
    }
};


function $(id) {
    return document.getElementById(id);
}


function showCharacterCreation() {

    $("titleScreen").classList.add("hidden");
    $("characterScreen").classList.remove("hidden");
}


function randomName() {

    const name =
        names[Math.floor(Math.random() * names.length)];

    $("heroName").value = name;
}


function randomHero() {

    randomName();

    const races = [
        "Human",
        "Elf",
        "Dwarf",
        "Half-Elf",
        "Halfling"
    ];

    const classes = [
        "Warrior",
        "Ranger",
        "Mage",
        "Rogue",
        "Cleric"
    ];

    $("heroRace").value =
        races[Math.floor(Math.random() * races.length)];

    $("heroClass").value =
        classes[Math.floor(Math.random() * classes.length)];
}


function startAdventure() {

    hero.name =
        $("heroName").value.trim() ||
        names[Math.floor(Math.random() * names.length)];

    hero.race = $("heroRace").value;
    hero.class = $("heroClass").value;

    hero.hp = 100;
    hero.maxHp = 100;
    hero.baseAttack = 10;
    hero.baseDefense = 10;
    hero.level = 1;
    hero.xp = 0;
    hero.nextXp = 100;
    hero.gold = 25;
    hero.weapon = "Rusty Sword";
    hero.armor = "Traveler's Clothes";

    hero.inventory = {
        Potion: 3,
        "Old Coin": 0
    };

    const bonus = classBonuses[hero.class];

    hero.maxHp += bonus.maxHp;
    hero.hp = hero.maxHp;
    hero.baseAttack += bonus.attack;
    hero.baseDefense += bonus.defense;

    hero.location = "Ember Hollow";

    currentScene = "emberStart";
    ashDepthStage = 0;

    $("characterScreen").classList.add("hidden");
    $("gameScreen").classList.remove("hidden");

    logMessage(
        hero.name + " begins the journey into the Emberlands."
    );

    showScene("emberStart");
    updateStats();
}


function logMessage(text) {

    const entry = document.createElement("div");
    entry.textContent = text;

    $("log").prepend(entry);
}


function showScene(scene) {

    currentScene = scene;

    const choices = $("choices");
    choices.innerHTML = "";

    let title = "";
    let type = "";
    let story = "";

    if (scene === "emberStart") {

        title = "Ember Hollow";
        type = "Village";
        hero.location = "Ember Hollow";

        story =
            "You awaken beside the ancient road leading into Ember Hollow.\n\n" +
            "Smoke rises from the distant village. The people move quickly through the streets, " +
            "and somewhere beyond the rooftops a bell rings once.\n\n" +
            "A wounded traveler catches your attention.";

        addChoice(
            "Speak with the wounded traveler",
            () => showScene("traveler")
        );

        addChoice(
            "Enter the village",
            () => showScene("village")
        );

    }


    else if (scene === "traveler") {

        title = "Ember Hollow";
        type = "A Strange Warning";

        story =
            "The traveler grips your arm.\n\n" +
            "\"The forest isn't safe,\" they whisper. \"Something has awakened beneath the old ruins. " +
            "If you hear whispering... don't answer it.\"\n\n" +
            "They point toward the forest road.";

        addChoice(
            "Head toward the Whispering Forest",
            () => showScene("forest")
        );

        addChoice(
            "Return to the village",
            () => showScene("village")
        );

    }


    else if (scene === "village") {

        title = "Ember Hollow";
        type = "Village";

        story =
            "Ember Hollow is small but busy. A blacksmith works near the square, " +
            "while frightened villagers discuss strange lights seen in the forest.\n\n" +
            "The road leading north disappears between ancient trees.";

        addChoice(
            "Leave for the Whispering Forest",
            () => showScene("forest")
        );

        addChoice(
            "Search the village",
            () => {

                hero.gold += 5;

                logMessage("You search the village and find 5 gold.");

                showScene("villageSearched");
                updateStats();
            }
        );

    }


    else if (scene === "villageSearched") {

        title = "Ember Hollow";
        type = "Village";

        story =
            "You find a few coins beneath an abandoned stall.\n\n" +
            "The forest road waits beyond the village gate.";

        addChoice(
            "Enter the Whispering Forest",
            () => showScene("forest")
        );

    }


    else if (scene === "forest") {

        title = "Whispering Forest";
        type = "Wilderness";

        hero.location = "Whispering Forest";

        story =
            "The trees close around you.\n\n" +
            "Wind moves through the branches, but the sound resembles distant voices. " +
            "An old trail divides ahead.";

        addChoice(
            "Investigate the movement",
            () => {

                logMessage("Something moves among the trees.");

                startCombat({
                    name: "Ash Wolf",
                    hp: 35,
                    maxHp: 35,
                    attack: 8,
                    defense: 3,
                    xp: 35,
                    gold: 10,
                    description:
                        "A gray wolf covered in ash steps from the darkness."
                });
            }
        );

        addChoice(
            "Follow the old trail",
            () => showScene("forestTrail")
        );

        addChoice(
            "Return to Ember Hollow",
            () => showScene("village")
        );

    }


    else if (scene === "forestTrail") {

        title = "Whispering Forest";
        type = "Ancient Trail";

        story =
            "The old trail leads deeper beneath the trees.\n\n" +
            "You discover a weathered stone marker covered in symbols. " +
            "Beyond it, broken towers rise from the forest floor.";

        addChoice(
            "Approach the Ancient Ruins",
            () => showScene("ruins")
        );

        addChoice(
            "Return to the forest",
            () => showScene("forest")
        );

    }


    else if (scene === "ruins") {

        title = "Ancient Ruins";
        type = "Forgotten Kingdom";

        hero.location = "Ancient Ruins";

        story =
            "The ruins are older than Ember Hollow itself.\n\n" +
            "Broken statues line a stone road. At its end stands a massive doorway leading underground.\n\n" +
            "A faint red glow pulses beneath the cracks.";

        addChoice(
            "Search the ruins",
            () => {

                hero.gold += 15;
                hero.inventory["Old Coin"] =
                    (hero.inventory["Old Coin"] || 0) + 1;

                logMessage(
                    "You search the ruins and find 15 gold and an Old Coin."
                );

                showScene("ruinsSearched");
                updateStats();
            }
        );

        addChoice(
            "Enter the underground passage",
            () => showScene("ashenEntrance")
        );

    }


    else if (scene === "ruinsSearched") {

        title = "Ancient Ruins";
        type = "Forgotten Kingdom";

        story =
            "Among the broken stones you uncover a strange coin bearing a crowned flame.\n\n" +
            "The underground passage waits beneath the ruins.";

        addChoice(
            "Enter the underground passage",
            () => showScene("ashenEntrance")
        );

    }


    /* ASHEN DEPTHS */

    else if (scene === "ashenEntrance") {

        title = "Ashen Depths";
        type = "Underground";

        hero.location = "Ashen Depths";
        ashDepthStage = 1;

        story =
            "You descend beneath the Ancient Ruins.\n\n" +
            "The stairs continue far below the earth. The air grows hot, yet the walls are coated in frost.\n\n" +
            "At the bottom you find three passages.\n\n" +
            "One glows with red light.\n" +
            "One disappears into darkness.\n" +
            "The final passage carries the sound of running water.";

        addChoice(
            "Follow the red glow",
            () => showScene("depthsRed")
        );

        addChoice(
            "Enter the dark passage",
            () => showScene("depthsDark")
        );

        addChoice(
            "Follow the sound of water",
            () => showScene("depthsWater")
        );

    }


    else if (scene === "depthsRed") {

        title = "Ashen Depths";
        type = "The Ember Tunnel";

        story =
            "The red glow becomes brighter as you descend.\n\n" +
            "Ash falls from the ceiling like snow.\n\n" +
            "A shape rises from a pile of ancient armor.";

        addChoice(
            "Fight the Ember Wraith",
            () => startCombat({
                name: "Ember Wraith",
                hp: 55,
                maxHp: 55,
                attack: 12,
                defense: 6,
                xp: 60,
                gold: 25,
                description:
                    "A burning spirit emerges from the armor of a forgotten knight."
            })
        );

        addChoice(
            "Retreat",
            () => showScene("ashenEntrance")
        );

    }


    else if (scene === "depthsDark") {

        title = "Ashen Depths";
        type = "The Black Passage";

        story =
            "You step into complete darkness.\n\n" +
            "After several minutes your hand touches something cold and metallic.\n\n" +
            "It is an ancient weapon resting on a stone altar.";

        addChoice(
            "Take the Moonblade",
            () => {

                hero.weapon = "Moonblade";

                logMessage(
                    "You recover the Moonblade from the ancient altar."
                );

                showScene("moonblade");
                updateStats();
            }
        );

        addChoice(
            "Leave it untouched",
            () => showScene("depthsDarkExit")
        );

    }


    else if (scene === "moonblade") {

        title = "Ashen Depths";
        type = "Ancient Altar";

        story =
            "The Moonblade hums softly in your hand.\n\n" +
            "The moment you lift it, a distant roar echoes through the tunnels.\n\n" +
            "Something knows you are here.";

        addChoice(
            "Continue deeper",
            () => showScene("guardian")
        );

    }


    else if (scene === "depthsDarkExit") {

        title = "Ashen Depths";
        type = "Ancient Passage";

        story =
            "You leave the ancient weapon behind.\n\n" +
            "The passage eventually opens into a massive underground chamber.";

        addChoice(
            "Enter the chamber",
            () => showScene("guardian")
        );

    }


    else if (scene === "depthsWater") {

        title = "Ashen Depths";
        type = "Underground River";

        story =
            "You follow the underground stream into a cavern filled with pale blue light.\n\n" +
            "A small stone shrine stands beside the water.";

        addChoice(
            "Drink from the spring",
            () => {

                hero.hp = hero.maxHp;

                logMessage(
                    "The strange spring restores your health."
                );

                showScene("waterBlessing");
                updateStats();
            }
        );

        addChoice(
            "Search the shrine",
            () => {

                hero.inventory.Potion =
                    (hero.inventory.Potion || 0) + 2;

                logMessage(
                    "You discover two Potions hidden inside the shrine."
                );

                showScene("waterBlessing");
                updateStats();
            }
        );

    }


    else if (scene === "waterBlessing") {

        title = "Ashen Depths";
        type = "Underground River";

        story =
            "The cavern falls silent.\n\n" +
            "Then the ground trembles.\n\n" +
            "Something enormous moves beyond the stone wall.";

        addChoice(
            "Continue toward the disturbance",
            () => showScene("guardian")
        );

    }


    else if (scene === "guardian") {

        title = "Ashen Depths";
        type = "The Guardian's Chamber";

        story =
            "You enter a vast chamber.\n\n" +
            "A circular platform sits above a bottomless pit. " +
            "At its center burns a black flame.\n\n" +
            "A massive armored figure rises beside it.\n\n" +
            "\"No mortal walks beyond this chamber,\" it says.";

        addChoice(
            "Challenge the guardian",
            () => startCombat({
                name: "Ashen Guardian",
                hp: 120,
                maxHp: 120,
                attack: 18,
                defense: 10,
                xp: 150,
                gold: 100,
                description:
                    "An ancient guardian forged to protect the secret beneath the ruins."
            })
        );

        addChoice(
            "Search for another way",
            () => showScene("guardianSearch")
        );

    }


    else if (scene === "guardianSearch") {

        title = "Ashen Depths";
        type = "Hidden Passage";

        story =
            "You search the walls and discover an ancient inscription.\n\n" +
            "The Old Coin you recovered from the ruins fits perfectly into a circular slot.\n\n" +
            "A hidden door opens.";

        if (hero.inventory["Old Coin"] > 0) {

            addChoice(
                "Use the Old Coin",
                () => showScene("hiddenChamber")
            );

        } else {

            story +=
                "\n\nYou have no coin that matches the inscription.";

            addChoice(
                "Return to the guardian",
                () => showScene("guardian")
            );
        }

    }


    else if (scene === "hiddenChamber") {

        title = "Ashen Depths";
        type = "The Hidden Chamber";

        story =
            "Beyond the hidden door lies a chamber untouched for centuries.\n\n" +
            "A crystal rests upon a stone pedestal.\n\n" +
            "The moment you approach it, the black flame in the guardian's chamber begins to roar.";

        addChoice(
            "Take the Ashen Crystal",
            () => {

                hero.inventory["Ashen Crystal"] = 1;

                logMessage(
                    "You obtained the Ashen Crystal."
                );

                showScene("crystalEnding");
                updateStats();
            }
        );

        addChoice(
            "Leave the crystal",
            () => showScene("guardian")
        );

    }


    else if (scene === "crystalEnding") {

        title = "The Ashen Depths";
        type = "A New Beginning";

        story =
            "The Ashen Crystal floats above your palm.\n\n" +
            "Images flash through your mind: fallen kingdoms, armies beneath black banners, " +
            "and a throne buried somewhere beyond the Emberlands.\n\n" +
            "The ruins were never the end of the story.\n\n" +
            "They were the beginning.\n\n" +
            "Far above, thunder rolls across the land.";

        addChoice(
            "Continue beyond the Ashen Depths",
            () => showScene("beyondDepths")
        );

    }


    else if (scene === "beyondDepths") {

        title = "Beyond the Ashen Depths";
        type = "The Road Ahead";

        hero.location = "Beyond the Ashen Depths";

        story =
            "A hidden staircase leads upward and emerges on the far side of the mountains.\n\n" +
            "For the first time you see the Emberlands stretching beyond the horizon.\n\n" +
            "Smoke rises from a distant fortress.\n\n" +
            "Your journey has only begun.";

        addChoice(
            "Approach the distant fortress",
            () => showScene("fortressRoad")
        );

        addChoice(
            "Rest and prepare",
            () => {

                hero.hp = hero.maxHp;

                logMessage(
                    "You rest and recover your strength."
                );

                updateStats();
            }
        );

    }


    else if (scene === "fortressRoad") {

        title = "The Emberlands";
        type = "Unknown Territory";

        hero.location = "The Emberlands";

        story =
            "The road stretches toward a fortress surrounded by black smoke.\n\n" +
            "Whatever awakened beneath the Ancient Ruins is connected to this place.\n\n" +
            "You tighten your grip on your weapon and continue forward.";

        addChoice(
            "Continue toward the fortress",
            () => {

                logMessage(
                    "The road ahead disappears into the smoke."
                );

                showScene("fortressRoad");
            }
        );

    }


    $("locationTitle").textContent = title;
    $("locationType").textContent = type;
    $("storyText").textContent = story;

    updateStats();
}


function addChoice(text, action) {

    const button = document.createElement("button");

    button.textContent = text;
    button.onclick = action;

    $("choices").appendChild(button);
}


function startCombat(enemy) {

    currentEnemy = {
        ...enemy
    };

    $("gameScreen").classList.add("hidden");
    $("combatScreen").classList.remove("hidden");

    $("enemyName").textContent =
        currentEnemy.name;

    $("enemyDescription").textContent =
        currentEnemy.description;

    $("combatMessage").textContent =
        "The battle begins!";

    updateCombat();
}


function updateCombat() {

    if (!currentEnemy) return;

    $("enemyHP").textContent =
        Math.max(0, currentEnemy.hp);

    $("enemyMaxHP").textContent =
        currentEnemy.maxHp;

    $("enemyHPBar").style.width =
        Math.max(
            0,
            (currentEnemy.hp / currentEnemy.maxHp) * 100
        ) + "%";

    $("combatHeroHP").textContent =
        Math.max(0, hero.hp);

    $("combatHeroMaxHP").textContent =
        hero.maxHp;

    $("heroHPBar").style.width =
        Math.max(
            0,
            (hero.hp / hero.maxHp) * 100
        ) + "%";

    updateStats();
}


function attackEnemy() {

    if (!currentEnemy) return;

    const weaponBonus =
        hero.weapon === "Moonblade" ? 12 :
        hero.weapon === "Ember Staff" ? 9 :
        hero.weapon === "Shadow Dagger" ? 7 :
        hero.weapon === "Iron Sword" ? 4 :
        0;

    let damage =
        hero.baseAttack +
        weaponBonus -
        currentEnemy.defense;

    damage = Math.max(
        2,
        damage + Math.floor(Math.random() * 7) - 3
    );

    currentEnemy.hp -= damage;

    $("combatMessage").textContent =
        "You deal " + damage +
        " damage to " +
        currentEnemy.name + ".";

    logMessage(
        "You hit " + currentEnemy.name +
        " for " + damage + " damage."
    );

    if (currentEnemy.hp <= 0) {

        winCombat();
        return;
    }

    enemyAttack();

    updateCombat();
}


function enemyAttack() {

    let damage =
        currentEnemy.attack -
        hero.baseDefense;

    damage = Math.max(
        1,
        damage + Math.floor(Math.random() * 5) - 2
    );

    hero.hp -= damage;

    $("combatMessage").textContent +=
        "\nThe " +
        currentEnemy.name +
        " hits you for " +
        damage +
        " damage.";

    logMessage(
        currentEnemy.name +
        " hits you for " +
        damage +
        " damage."
    );

    if (hero.hp <= 0) {

        hero.hp = 1;

        $("combatMessage").textContent +=
            "\nYou barely survive the attack.";

        logMessage(
            "You barely survive."
        );
    }
}


function defendTurn() {

    if (!currentEnemy) return;

    let damage =
        Math.max(
            1,
            currentEnemy.attack -
            Math.floor(hero.baseDefense * 1.5)
        );

    hero.hp -= damage;

    $("combatMessage").textContent =
        "You brace yourself and take only " +
        damage +
        " damage.";

    logMessage(
        "You defend against the attack."
    );

    if (hero.hp <= 0) {
        hero.hp = 1;
    }

    updateCombat();
}


function usePotion() {

    if (!hero.inventory.Potion ||
        hero.inventory.Potion <= 0) {

        $("combatMessage").textContent =
            "You have no Potions.";

        return;
    }

    if (hero.hp >= hero.maxHp) {

        $("combatMessage").textContent =
            "Your health is already full.";

        return;
    }

    hero.inventory.Potion--;

    const heal = 30;

    hero.hp =
        Math.min(
            hero.maxHp,
            hero.hp + heal
        );

    $("combatMessage").textContent =
        "You recover " + heal + " HP.";

    logMessage(
        "You use a Potion and recover health."
    );

    enemyAttack();

    updateCombat();
}


function winCombat() {

    const defeated = currentEnemy;

    hero.xp += defeated.xp;
    hero.gold += defeated.gold;

    logMessage(
        "You defeated " +
        defeated.name +
        "! +" +
        defeated.xp +
        " XP, +" +
        defeated.gold +
        " gold."
    );

    checkLevelUp();

    currentEnemy = null;

    $("combatScreen").classList.add("hidden");
    $("gameScreen").classList.remove("hidden");

    $("combatMessage").textContent = "";

    if (defeated.name === "Ash Wolf") {

        showScene("forestAfterWolf");

    } else if (defeated.name === "Ember Wraith") {

        showScene("wraithDefeated");

    } else if (defeated.name === "Ashen Guardian") {

        showScene("guardianDefeated");

    } else {

        showScene(currentScene);
    }

    updateStats();
}


function checkLevelUp() {

    while (hero.xp >= hero.nextXp) {

        hero.level++;

        hero.xp -= hero.nextXp;

        hero.nextXp =
            Math.floor(hero.nextXp * 1.5);

        hero.maxHp += 10;
        hero.hp = hero.maxHp;

        hero.baseAttack += 2;
        hero.baseDefense += 2;

        logMessage(
            "LEVEL UP! You are now level " +
            hero.level + "."
        );
    }
}


function showAfterCombat(scene) {

    showScene(scene);
}


function updateStats() {

    $("statName").textContent = hero.name;
    $("statLevel").textContent = hero.level;
    $("statHP").textContent =
        hero.hp + " / " + hero.maxHp;

    const weaponBonus =
        hero.weapon === "Moonblade" ? 12 :
        hero.weapon === "Ember Staff" ? 9 :
        hero.weapon === "Shadow Dagger" ? 7 :
        hero.weapon === "Iron Sword" ? 4 :
        0;

    const armorBonus =
        hero.armor === "Iron Armor" ? 6 :
        hero.armor === "Holy Vestments" ? 7 :
        hero.armor === "Shadow Leather" ? 4 :
        hero.armor === "Ranger Cloak" ? 3 :
        0;

    $("statAttack").textContent =
        hero.baseAttack + weaponBonus;

    $("statDefense").textContent =
        hero.baseDefense + armorBonus;

    $("statGold").textContent =
        hero.gold;

    $("statXP").textContent =
        hero.xp + " / " + hero.nextXp;

    $("statWeapon").textContent =
        hero.weapon;

    $("statArmor").textContent =
        hero.armor;

    $("statLocation").textContent =
        hero.location;

    updateInventory();
}


function updateInventory() {

    const container = $("inventory");

    container.innerHTML = "";

    const keys =
        Object.keys(hero.inventory);

    if (keys.length === 0) {

        container.innerHTML =
            "<div class='item'>Empty</div>";

        return;
    }

    keys.forEach(item => {

        const div =
            document.createElement("div");

        div.className = "item";

        div.textContent =
            item +
            ": " +
            hero.inventory[item];

        container.appendChild(div);
    });
}


/* POST-COMBAT SCENES */

function forestAfterWolf() {

    showScene("forestAfterWolf");
}


/* Add the missing scenes through a small override */

const originalShowScene = showScene;

showScene = function(scene) {

    if (scene === "forestAfterWolf") {

        $("locationTitle").textContent =
            "Whispering Forest";

        $("locationType").textContent =
            "After the Battle";

        $("storyText").textContent =
            "The Ash Wolf collapses into a cloud of gray dust.\n\n" +
            "Behind where it stood, you notice a narrow trail that was hidden beneath the roots.\n\n" +
            "The trail leads toward ancient stone towers.";

        $("choices").innerHTML = "";

        addChoice(
            "Follow the hidden trail",
            () => originalShowScene("ruins")
        );

        addChoice(
            "Return to Ember Hollow",
            () => originalShowScene("village")
        );

        hero.location = "Whispering Forest";

        updateStats();

        return;
    }


    if (scene === "wraithDefeated") {

        $("locationTitle").textContent =
            "Ashen Depths";

        $("locationType").textContent =
            "The Ember Tunnel";

        $("storyText").textContent =
            "The Ember Wraith dissolves into sparks.\n\n" +
            "Behind it, a sealed stone door cracks open.\n\n" +
            "Beyond it lies a chamber deeper than anything you have seen beneath the ruins.";

        $("choices").innerHTML = "";

        addChoice(
            "Enter the deeper chamber",
            () => originalShowScene("guardian")
        );

        addChoice(
            "Return to the main passage",
            () => originalShowScene("ashenEntrance")
        );

        hero.location = "Ashen Depths";

        updateStats();

        return;
    }


    if (scene === "guardianDefeated") {

        $("locationTitle").textContent =
            "Ashen Depths";

        $("locationType").textContent =
            "The Guardian's Chamber";

        $("storyText").textContent =
            "The Ashen Guardian falls to one knee.\n\n" +
            "The black flame behind it suddenly changes to silver.\n\n" +
            "The ancient machine speaks one final sentence:\n\n" +
            "\"The path beyond is open. The darkness above has already begun.\"";

        $("choices").innerHTML = "";

        addChoice(
            "Pass through the opened gate",
            () => originalShowScene("crystalEnding")
        );

        addChoice(
            "Search the guardian's chamber",
            () => {

                hero.gold += 50;

                hero.inventory["Ashen Crystal"] = 1;

                logMessage(
                    "You discover 50 gold and the Ashen Crystal."
                );

                originalShowScene("crystalEnding");
                updateStats();
            }
        );

        hero.location = "Ashen Depths";

        updateStats();

        return;
    }


    originalShowScene(scene);
};

</script>
